<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F172A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Money Manage"><link rel="apple-touch-icon" href="kucing-192.png"></head><body>
<title>Money Manage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead, one-column mobile app, bottom tab bar. Emerald is the single accent; amber/red only for status. */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface2:#F7F9F8;--ink:#0F172A;--mute:#5B6B7A;--line:#E1E8E4;
  --navy:#0F172A;--on-navy:#FFFFFF;--navy-mute:#94A3B8;
  --accent:#059669;--accent-ink:#FFFFFF;--mint:#34D399;--tint:#E6F7EF;
  --input:#2563EB;--good:#15803D;--warn:#B45309;--bad:#DC2626;--warn-tint:#FEF3C7;--bad-tint:#FEE2E2;
  --track:#E2E8E5;
  --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1210;--surface:#121C18;--surface2:#0F1814;--ink:#E7EEEA;--mute:#8FA39A;--line:#22312B;
  --navy:#07100D;--on-navy:#F1F7F4;--navy-mute:#8FA39A;
  --accent:#34D399;--accent-ink:#04130C;--mint:#34D399;--tint:#10261D;
  --input:#7FAAFF;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--warn-tint:#3A2A0A;--bad-tint:#3A1414;
  --track:#1F2E28;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1210;--surface:#121C18;--surface2:#0F1814;--ink:#E7EEEA;--mute:#8FA39A;--line:#22312B;
  --navy:#07100D;--on-navy:#F1F7F4;--navy-mute:#8FA39A;
  --accent:#34D399;--accent-ink:#04130C;--mint:#34D399;--tint:#10261D;
  --input:#7FAAFF;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--warn-tint:#3A2A0A;--bad-tint:#3A1414;
  --track:#1F2E28;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.num,.big,.kv b,.in{font-variant-numeric:tabular-nums}

/* masthead */
.top{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--mint)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:14px}
.top h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--navy-mute);font-size:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--navy-mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--navy-mute)}
.sync[data-s="ok"] i{background:var(--mint)}.sync[data-s="saving"] i{background:#FBBF24}.sync[data-s="err"] i{background:#F87171}

main{padding-top:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.005em}
.eyebrow{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hint{margin:2px 0 0;font-size:12px;color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600}
.empty{margin:0;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);font-size:12.5px;text-align:center}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{color:var(--navy-mute)}
.hero .big{font-family:var(--display);font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em}
.lvl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em}
.lvl-ic{font-size:20px}
.hero .bar{background:rgba(255,255,255,.14)}
.hero p{margin:0;color:var(--navy-mute);font-size:12.5px}
.quote{margin:0;font-size:12.5px;color:var(--mute);padding:0 4px}

.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;min-width:0}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}

/* attention list */
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att a{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.att li:first-child a{border-top:0;padding-top:2px}
.att .dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.att [data-s="good"] .dot{background:var(--good)}.att [data-s="warn"] .dot{background:var(--warn)}.att [data-s="bad"] .dot{background:var(--bad)}
.att b{display:block;font-weight:600}.att small{color:var(--mute);font-size:12px}
.att svg{width:16px;height:16px;stroke:var(--mute)}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;min-width:0}
.mod .v{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.mod small{color:var(--mute);font-size:12px}
.mod.hi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mod.hi small,.mod.hi .eyebrow{color:inherit;opacity:.8}
.mod.neg .v{color:var(--bad)}

/* key/value */
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.kv b{display:block;font-family:var(--display);font-size:18px;margin-top:2px;overflow-wrap:anywhere}
.kv.hi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.kv.hi span{color:inherit;opacity:.8}
.kv.bad b{color:var(--bad)}.kv.good b{color:var(--good)}.kv.warn b{color:var(--warn)}
.kv.hi b{color:inherit}

/* inputs: blue text = editable (same convention as the Excel files) */
.in{font:inherit;color:var(--input);background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:9px 2px;min-height:40px;width:100%;min-width:0;outline:0}
.in:focus{border-bottom:2px solid var(--accent);background:var(--tint)}
.in.n{text-align:right}
.in::placeholder{color:var(--mute);opacity:.6}
.in.t{font-weight:600}textarea.in{resize:none;field-sizing:content;line-height:1.4;font-family:inherit}
.lab{display:flex;flex-direction:column;gap:0;min-width:0;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.lab .in{font-size:14px;letter-spacing:0;text-transform:none;font-weight:600}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 112px 36px;gap:8px;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.chk{grid-template-columns:34px minmax(0,1fr) 108px 36px}
.row.note{grid-template-columns:minmax(0,1fr) 36px}
.row .pc{grid-column:2/-1;font-size:11.5px;color:var(--mute);text-align:right;margin-top:-6px;padding-bottom:6px}
.row.chk .pc{grid-column:2/-1}
.tick{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:transparent;cursor:pointer;display:grid;place-content:center;margin:0 auto}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:focus-visible,.btn:focus-visible,.tabs a:focus-visible,.seg button:focus-visible,.mod:focus-visible,.att a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.paid .in.t{text-decoration:line-through;color:var(--mute)}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:10px;padding:12px 14px;font-weight:700}
.total b{font-family:var(--display);font-size:18px;color:var(--accent)}

.btn{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:10px 14px;min-height:40px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.x{background:transparent;color:var(--mute);padding:0;width:36px;min-height:36px;font-size:18px;line-height:1;border-radius:8px}
.btn.x[data-armed]{background:var(--bad-tint);color:var(--bad);width:auto;padding:0 8px;font-size:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* account cards */
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.acc-h{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:8px;align-items:center}
.acc-h.lg{grid-template-columns:42px minmax(0,1fr) 36px}
.logo{width:42px;height:42px;border-radius:11px;border:1px dashed var(--mute);display:grid;place-content:center;overflow:hidden;cursor:pointer;background:var(--surface);color:var(--mute);font-size:20px;line-height:1}
.logo.has{border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;color:var(--mute);font-size:11.5px;text-decoration:underline;cursor:pointer;margin-left:auto}
.acc-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.res b{font-weight:700}.pos{color:var(--good)}.neg{color:var(--bad)}
.share{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute)}.share .bar{flex:1;height:6px}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:12px}
.lv{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.lv .ic{font-size:20px;text-align:center;grid-row:1/3}
.lv .nm{font-weight:700}.lv .nm small{color:var(--mute);font-weight:500;margin-left:6px}
.lv .st{font-size:11.5px;font-weight:700;color:var(--mute)}
.lv.done .st{color:var(--good)}.lv.next .st{color:var(--accent)}
.lv .bar{grid-column:2/4;height:7px}
.lv.lock{opacity:.6}

/* month bars */
.mbars{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative;padding-top:6px;border-bottom:1px solid var(--line)}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mb i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--mint);min-height:2px}
.mb.low i{background:var(--warn)}
.mb span{font-size:10px;color:var(--mute);position:absolute;bottom:-18px;white-space:nowrap}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute);opacity:.6}
.goal em{position:absolute;right:0;top:-16px;font-style:normal;font-size:10px;color:var(--mute)}
.mlab{display:flex;gap:6px;margin-top:6px}.mlab span{flex:1;text-align:center;font-size:10px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) 100px 36px;gap:8px;align-items:center;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ml{font-weight:700}.mrow .md{text-align:right;font-size:11.5px;color:var(--mute);white-space:nowrap}
.mrow.h{grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 70px 36px}
.mrow.h .md{font-size:11.5px}
.mrow.dl{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.8fr) 36px}
.tbl-h{display:grid;gap:8px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding-bottom:4px}
.scroll{overflow-x:auto}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--mute);border-radius:9px;padding:10px;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--tint);color:var(--good)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}.pill.bad{background:var(--bad-tint);color:var(--bad)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:10.5px;font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--tint)}
@media (min-width:560px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:760px){.kvs.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.bar i,.mb i{transition:width .5s ease,height .5s ease}}
/* net worth chart */
.seg.s4{grid-template-columns:repeat(4,1fr)}.seg.s4 button{padding:8px 2px;min-height:38px;font-size:12.5px}
.nwc{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.nwr{font-size:12.5px;color:var(--mute);min-height:34px;line-height:1.35}.nwr b{color:var(--ink)}
.nwc svg{display:block;width:100%;height:auto;overflow:visible}
.nwc text{font-family:var(--body);font-size:9px;fill:var(--mute)}
.nwleg{display:flex;gap:14px;font-size:11.5px;color:var(--mute)}.nwleg i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:5px}.nwleg i.m{border-top:2px dashed var(--mute)}

/* ===== Liquid glass + animasi ===== */
:root{--g-bg:rgba(255,255,255,.58);--g-bg2:rgba(255,255,255,.30);--g-brd:rgba(255,255,255,.75);--g-hi:rgba(255,255,255,.9);--g-lo:rgba(255,255,255,.25);--g-sh:rgba(15,23,42,.10);--g-thumb:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:rgba(24,38,32,.55);--g-bg2:rgba(24,38,32,.30);--g-brd:rgba(255,255,255,.14);--g-hi:rgba(255,255,255,.22);--g-lo:rgba(255,255,255,.04);--g-sh:rgba(0,0,0,.35);--g-thumb:rgba(60,90,76,.75)}}
:root[data-theme="dark"]{--g-bg:rgba(24,38,32,.55);--g-bg2:rgba(24,38,32,.30);--g-brd:rgba(255,255,255,.14);--g-hi:rgba(255,255,255,.22);--g-lo:rgba(255,255,255,.04);--g-sh:rgba(0,0,0,.35);--g-thumb:rgba(60,90,76,.75)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 38% at 8% 2%,rgba(52,211,153,.30),transparent 70%),radial-gradient(50% 34% at 100% 32%,rgba(96,165,250,.24),transparent 70%),radial-gradient(60% 38% at 25% 100%,rgba(167,139,250,.20),transparent 70%)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.mod{background:linear-gradient(145deg,var(--g-bg),var(--g-bg2));border:1px solid var(--g-brd);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 10px 28px -10px var(--g-sh)}
  .seg{background:linear-gradient(145deg,var(--g-bg2),var(--g-lo));border:1px solid var(--g-brd);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 4px 14px -6px var(--g-sh)}
  .seg button[aria-pressed="true"]{background:linear-gradient(160deg,var(--g-thumb),var(--g-bg));
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 4px 12px -2px var(--g-sh),0 0 0 1px var(--g-brd)}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--navy) 66%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  .tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:26px;max-width:736px;margin:0 auto;
    background:linear-gradient(145deg,var(--g-bg),var(--g-bg2));border:1px solid var(--g-brd);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 14px 34px -8px var(--g-sh)}
  .tabs a{border-radius:20px}
  .tabs a[aria-current="page"]{background:linear-gradient(160deg,var(--g-thumb),var(--g-bg2));box-shadow:inset 0 1px 0 var(--g-hi),0 4px 12px -3px var(--g-sh)}
  main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
.seg button[aria-pressed="true"]{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.tabs a[aria-current="page"] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.tabs a,.seg button,.btn{transition:transform .15s ease,background .25s ease,color .25s ease}
.tabs a:active,.seg button:active,.btn:active{transform:scale(.94)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.07s}main.enter>*:nth-child(3){animation-delay:.14s}main.enter>*:nth-child(4){animation-delay:.21s}
main.enter>*:nth-child(5){animation-delay:.28s}main.enter>*:nth-child(6){animation-delay:.35s}main.enter>*:nth-child(n+7){animation-delay:.42s}
/* kotak dalam kad: kaca */
.acc,.kv{background:linear-gradient(145deg,var(--g-in1),var(--g-in2));border:1px solid var(--g-brd);border-radius:16px;
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 8px 20px -10px var(--g-sh)}

(function(){

const fmtISO=s=>{if(!s)return '-';const [y,m,d]=s.split('-').map(Number);return d+' '+MS[m-1]+' '+y};
const num=v=>{v=String(v).replace(/[^\d.\-]/g,'');if(v===''||v==='-'||v==='.')return null;const n=parseFloat(v);return isNaN(n)?null:n};

  saving:()=>({accounts:[],goals:[],target:100000,goal:1000,

    monthly:[],history:[],updated:todayISO()}),
  delivery:()=>({rows:[]}),
  komitmen:()=>({label:ML[new Date().getMonth()]+' '+new Date().getFullYear(),income:[],items:[],notes:[],history:[]}),
  spaylater:()=>({name:'',target:0,entries:[],ryt:'',spay:'',notes:[]}),

const state={};DOCS.forEach(n=>state[n]=DEF[n]());

const pn=()=>String(state.spaylater.name||'').trim()||'SPayLater',an=()=>String(state.advance.name||'').trim()||'Advance';
/* ---------- calculations ---------- */
function calc(){
  const s=state.saving,k=state.komitmen,p=state.spaylater,a=state.advance,d=state.delivery,now=new Date(),cur=nowYm();
  const C={};
  C.modal=sum(s.accounts,x=>x.modal);C.nilai=sum(s.accounts,x=>x.nilai);C.profit=C.nilai-C.modal;C.roi=C.modal>0?C.profit/C.modal:0;
  const filled=s.monthly.filter(m=>m.amt>0);
  C.mTotal=sum(s.monthly,m=>m.amt);C.mAvg=filled.length?C.mTotal/filled.length:0;
  C.remain=Math.max(s.target-C.nilai,0);C.prog=s.target>0?clamp(C.nilai/s.target):0;
  C.months=C.mAvg>0?Math.ceil(C.remain/C.mAvg):null;
  C.eta=C.months!=null?addMonths(now,C.months):null;
  C.lv=s.levels.map(l=>({...l,amt:l.pct*s.target}));
  C.li=0;C.lv.forEach((l,i)=>{if(C.nilai>=l.amt)C.li=i});
  C.cur=C.lv[C.li];C.next=C.lv[C.li+1]||null;

  C.toNext=C.next?Math.max(C.next.amt-C.nilai,0):0;

  const upto=s.monthly.filter(m=>m.ym<=cur).sort((x,y)=>x.ym<y.ym?-1:1);
  let st=0;upto.forEach(m=>{if(s.goal>0&&m.amt>=s.goal)st++;else if(m.ym!==cur)st=0});

  let best=null;s.monthly.forEach(m=>{if(m.amt>0&&(!best||m.amt>best.amt))best=m});C.best=best;

  // delivery
  const dr=d.rows;C.dInc=sum(dr,r=>r.inc);C.dTip=sum(dr,r=>r.tip);C.dSav=sum(dr,r=>r.sav);C.dNet=C.dInc+C.dTip-C.dSav;

  const g={};dr.forEach(r=>{if(!r.d)return;const ym=r.d.slice(0,7);const o=g[ym]||(g[ym]={ym,days:0,inc:0,tip:0,sav:0});if(r.inc>0)o.days++;o.inc+=+r.inc||0;o.tip+=+r.tip||0;o.sav+=+r.sav||0});

  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();C.k.daysLeft=dim-now.getDate()+1;
  C.k.perDay=C.k.baki>0?C.k.baki/C.k.daysLeft:0;
  // spaylater / advance
  C.p={got:sum(p.entries,x=>x.amt)};C.p.baki=Math.max(p.target-C.p.got,0);C.p.prog=p.target>0?clamp(C.p.got/p.target):0;
  C.a={used:sum(a.items,x=>x.amt)};C.a.baki=a.amount-C.a.used;C.a.prog=a.amount>0?clamp(C.a.used/a.amount):0;
  return C;
}

function nwFmt(n){const a=Math.abs(n);return 'RM'+(a>=1e6?(n/1e6).toFixed(2)+'J':a>=1e3?(n/1e3).toFixed(a>=1e5?0:1)+'K':Math.round(n))}
function nwChange(cur,prev){if(prev==null)return null;const d=cur-prev;return {d,p:prev>0?d/prev:null}}
function nwView(C){
  const cur=nowYm(),h=state.saving.history;

  let all=Object.values(map).sort((a,b)=>a.ym<b.ym?-1:1);
  const near=ym=>{let b=null,bd=9;all.forEach(x=>{if(x.ym===cur)return;const d=Math.abs((+x.ym.slice(0,4)*12+ +x.ym.slice(5,7))-(+ym.slice(0,4)*12+ +ym.slice(5,7)));if(d<bd){bd=d;b=x}});return bd<=1?b:null};

  let body;
  if(pts.length<2){
    body=`<p class="empty">${all.length<2?'Graf akan keluar bila ada sekurang-kurangnya 2 bulan snapshot. Tekan <b>Simpan snapshot</b> kat tab Simpanan hujung setiap bulan.':'Tak cukup data dalam julat ni. Cuba pilih Semua.'}</p>`;
  }else{
    const W=320,H=170,L=42,R=8,T=8,B=20,iw=W-L-R,ih=H-T-B;
    const vals=[];pts.forEach(x=>{vals.push(x.n);if(x.m>0)vals.push(x.m)});
    let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.12||Math.abs(hi)*0.1||1;
    lo-=pad;hi+=pad;if(Math.min(...vals)>=0)lo=Math.max(lo,0);

    const line=pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.n).toFixed(1)}`).join(' ');
    const area=`M${X(0).toFixed(1)},${(T+ih)} L${pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.n).toFixed(1)}`).join(' L')} L${X(pts.length-1).toFixed(1)},${(T+ih)} Z`;
    const mpts=pts.map((x,i)=>x.m>0?`${X(i).toFixed(1)},${Y(x.m).toFixed(1)}`:null).filter(Boolean).join(' ');
    const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    const xl=idx.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${ymLab(pts[i].ym)}</text>`).join('');
    const data=pts.map((x,i)=>({x:+X(i).toFixed(1),y:+Y(x.n).toFixed(1),l:ymLab(x.ym),n:x.n,m:x.m}));
    const lp=data[data.length-1];
    body=`<div class="nwc" data-pts="${esc(JSON.stringify(data))}">
      <div class="nwr">${nwRead(lp)}</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf nilai aset mengikut bulan">${grid}
        <path d="${area}" style="fill:var(--accent);fill-opacity:.12"/>
        ${mpts?`<polyline points="${mpts}" style="fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:4 3"/>`:''}
        <polyline points="${line}" style="fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>
        <line class="nwl" x1="${lp.x}" x2="${lp.x}" y1="${T}" y2="${T+ih}" style="stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3"/>
        <circle class="nwd" cx="${lp.x}" cy="${lp.y}" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>

  }

    <div class="kvs">${cmp(mm,'Bulan ke bulan')}${cmp(yy,'Tahun ke tahun')}</div></section>`;

const okLogo=v=>typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(v);
async function toLogo(file){
  let src,w,h,rev=()=>{};
  try{src=await createImageBitmap(file);w=src.width;h=src.height}
  catch(e){const u=URL.createObjectURL(file);src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u});w=src.naturalWidth;h=src.naturalHeight;rev=()=>URL.revokeObjectURL(u)}
  const m=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=96;
  const g=c.getContext('2d');g.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,96,96);rev();
  const out=c.toDataURL('image/png');return out.length>60000?c.toDataURL('image/jpeg',.8):out;
}

function dvChart(C){
  const rows=state.delivery.rows.filter(r=>r.d),net=r=>(+r.inc||0)+(+r.tip||0)-(+r.sav||0);
  let it=[];
  if(dvRange==='d')it=[...rows].sort((a,b)=>a.d<b.d?-1:1).slice(-14).map(r=>({l:String(+r.d.slice(8,10)),v:net(r)}));
  else if(dvRange==='w'){const g={};rows.forEach(r=>{const d=new Date(r.d+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());g[k]=(g[k]||0)+net(r)});it=Object.keys(g).sort().slice(-8).map(k=>({l:(+k.slice(8,10))+' '+MS[+k.slice(5,7)-1],v:g[k]}))}

  if(!it.length)return '';
  const mx=Math.max(...it.map(x=>Math.abs(x.v)),1),tot=sum(it,x=>x.v),avg=tot/it.length,top=Math.max(...it.map(x=>x.v));
  const lab=it.length<=10;
  return `<section class="panel">${head('Graf pendapatan bersih','Pendapatan + tip − saving.')}${seg}
  <div class="dvc" role="img" aria-label="Graf bar pendapatan bersih">${it.map((x,j)=>`<div class="dvb">${lab?`<span>${Math.round(x.v)}</span>`:''}<i class="${x.v<0?'neg':''}" style="height:${Math.max(3,Math.abs(x.v)/mx*100*.78).toFixed(1)}%;animation-delay:${j*35}ms"></i><em>${esc(x.l)}</em></div>`).join('')}</div>
  <div class="kvs">${kv('Purata',rm(avg,0))}${kv('Tertinggi',rm(top,0))}</div></section>`;
}

/* ---------- state mutation + saving ---------- */
function setSync(s,t){const e=document.getElementById('sync');e.dataset.s=s;document.getElementById('syncT').textContent=t}
function touch(name){dirty.add(name);clearTimeout(timers[name]);setSync('saving','Menyimpan');timers[name]=setTimeout(()=>flush(name),600)}
async function flush(name){
  if(!db){
    if(localMode){try{localStorage.setItem(KEY,JSON.stringify(state));dirty.delete(name);if(!dirty.size)setSync('ok','Tersimpan di peranti')}catch(e){setSync('err','Tak boleh simpan');dbErr='Browser ni tak benarkan simpan data. Guna Simpan fail untuk sandaran.';later()}return}
    setSync('err','Tak disimpan');return}
  if(writing[name]){again[name]=true;return}
  writing[name]=true;dirty.delete(name);
  const body=JSON.parse(JSON.stringify(state[name]));
  try{await db.doc('m/'+name).set(body);last[name]=JSON.stringify(body);dbErr='';if(!dirty.size&&!again[name])setSync('ok','Tersimpan')}
  catch(e){setSync('err','Gagal simpan');dbErr='Data gagal disimpan ('+(e&&e.code||'ralat')+'). Cuba lagi sekejap.';later()}
  writing[name]=false;
  if(again[name]||dirty.has(name)){again[name]=false;flush(name)}
}
function setK(path,val){const p=path.split('.');const doc=p.shift();let o=state[doc];for(let i=0;i<p.length-1;i++)o=o[p[i]];const lk=p[p.length-1];if(o[lk]===val)return false;o[lk]=val;touch(doc);return true}
function getArr(path){const p=path.split('.');const doc=p.shift();let o=state[doc];p.forEach(x=>o=o[x]);return [doc,o]}
const NEW={
  'saving.accounts':()=>({name:'',modal:null,nilai:null}),
  'saving.goals':()=>({name:'',target:null,from:''}),
  'saving.monthly':()=>{const a=state.saving.monthly;const l=a.reduce((m,x)=>x.ym>m?x.ym:m,'');return {ym:l?addYm(l,1):nowYm(),amt:null}},
  'saving.history':()=>{const a=state.saving.history;const l=a.reduce((m,x)=>x.ym>m?x.ym:m,'');return {ym:l?addYm(l,1):nowYm(),modal:null,nilai:null}},
  'komitmen.income':()=>({name:'',amt:null}),

  'komitmen.notes':()=>'',
  'spaylater.entries':()=>({name:'',amt:null}),

};

  const t=e.target;if(!t.dataset||!t.dataset.k)return;
  const ty=t.dataset.t;let v;
  if(ty==='n')v=num(t.value);else if(ty==='b')v=t.checked;else v=t.value.trim();

});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='imp'||!t.files||!t.files[0])return;
  t.files[0].text().then(tx=>{try{const o=JSON.parse(tx);DOCS.forEach(n=>{if(o[n]){state[n]=Object.assign(DEF[n](),o[n]);touch(n)}});dbErr=localMode?dbErr:'';later()}catch(x){dbErr='Fail sandaran tak sah.';later()}})});

   .catch(()=>{dbErr='Logo tak dapat dimuat. Cuba gambar lain.';later()});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='dvr'){dvRange=b.dataset.v;try{localStorage.setItem('dvRange',dvRange)}catch(x){}later();return}
  if(act.indexOf('pin-')===0){pinAct(act);return}
  if(act==='newmonth'){
    if(!b.dataset.armed){b.dataset.armed='1';const o=b.textContent;b.textContent='Pasti?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},3000);return}
    const k=state.komitmen,C=calc(),snap=JSON.parse(JSON.stringify(k));
    k.history=(k.history||[]).concat([{label:k.label,income:C.k.income,commit:C.k.commit,paid:C.k.paid,baki:C.k.baki}]).slice(-24);
    let m=-1,y=0;const mm=/([A-Za-z]+)\s+(\d{4})/.exec(k.label||'');
    if(mm){m=ML.findIndex(x=>x.toLowerCase()===mm[1].toLowerCase());y=+mm[2]}
    if(m<0){const n=new Date();m=n.getMonth();y=n.getFullYear()}else{m++;if(m>11){m=0;y++}}
    k.label=ML[m]+' '+y;k.items.forEach(x=>x.paid=false);touch('komitmen');later();
    setUndo('Bulan baru dimulakan',()=>{state.komitmen=Object.assign(DEF.komitmen(),snap);touch('komitmen');later()});return}
  if(act==='logo-clear'){const a=state.saving.accounts[+b.dataset.i];if(a){delete a.logo;touch('saving');later()}return}
  if(act==='nwr'){nwRange=b.dataset.v;try{localStorage.setItem('nwRange',nwRange)}catch(x){}later();return}
  if(act==='seg'){bilTab=b.dataset.v;try{localStorage.setItem('bilTab',bilTab)}catch(x){}later();return}
  if(act==='add'){const k=b.dataset.k;const [doc,arr]=getArr(k);arr.push(NEW[k]());touch(doc);pendingFocus=k+'.'+(arr.length-1);later();return}
  if(act==='del'){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Pasti?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML='&times;'}},3000);return}
    const [doc,arr]=getArr(b.dataset.k),ix=+b.dataset.i,item=arr[ix],kk=b.dataset.k;arr.splice(ix,1);touch(doc);later();
    setUndo('Dipadam',()=>{const [d2,a2]=getArr(kk);a2.splice(Math.min(ix,a2.length),0,item);touch(d2);later()});return}
  if(act==='reset-paid'){state.komitmen.items.forEach(x=>x.paid=false);touch('komitmen');later();return}
  if(act==='snap'){const C=calc(),ym=nowYm();let h=state.saving.history.find(x=>x.ym===ym);if(!h){h={ym};state.saving.history.push(h)}h.modal=+C.modal.toFixed(2);h.nilai=+C.nilai.toFixed(2);touch('saving');later();return}
  if(act==='backup'){const fn='duit-icad-sandaran-'+todayISO()+'.json',txt=JSON.stringify(state,null,2);
    const local=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
    Promise.resolve().then(()=>typeof claude!=='undefined'?claude.use('downloads'):null).then(dl=>dl?dl.save({filename:fn,data:txt}).catch(()=>{}):local()).catch(local);return}
});

/* net worth chart scrub */
function nwScrub(e){
  const w=e.target.closest&&e.target.closest('.nwc');if(!w)return;
  if(e.type==='pointermove'&&e.pointerType==='mouse'&&!e.buttons&&false)return;
  let pts;try{pts=JSON.parse(w.dataset.pts)}catch(x){return}
  const sv=w.querySelector('svg'),r=sv.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*320;
  let b=pts[0];pts.forEach(p=>{if(Math.abs(p.x-vx)<Math.abs(b.x-vx))b=p});
  const l=w.querySelector('.nwl'),d=w.querySelector('.nwd');
  l.setAttribute('x1',b.x);l.setAttribute('x2',b.x);d.setAttribute('cx',b.x);d.setAttribute('cy',b.y);
  w.querySelector('.nwr').innerHTML=nwRead(b);
}
document.addEventListener('pointerdown',nwScrub);
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons&&!(e.target.closest&&e.target.closest('.nwc')))return;nwScrub(e)});


/* ---------- buat asal (toast) ---------- */
let undoFn=null,undoT=0;
function setUndo(msg,fn){
  undoFn=fn;const t=document.getElementById('toast');document.getElementById('toastB').style.display=fn?'':'none';document.getElementById('toastT').textContent=msg;
  t.classList.add('on');clearTimeout(undoT);undoT=setTimeout(()=>{t.classList.remove('on');undoFn=null},7000);
}
document.getElementById('toastB').addEventListener('click',()=>{
  const f=undoFn;undoFn=null;clearTimeout(undoT);document.getElementById('toast').classList.remove('on');if(f)f();
});

/* ---------- kunci PIN + cap jari (pada peranti ni sahaja) ---------- */
const PK={pin:'mm-pin',salt:'mm-salt',bio:'mm-bio'};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const hasPin=()=>!!lsGet(PK.pin);
async function hashPin(pin,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const t=salt+':'+pin;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'x'+h}
}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function bioReg(){
  try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Money Manage'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'pengguna',displayName:'Pengguna'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});lsSet(PK.bio,b64(c.rawId));return true}catch(e){return false}
}
async function bioAuth(){
  try{const raw=lsGet(PK.bio);if(!raw)return false;await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(raw),transports:['internal']}],userVerification:'required',timeout:60000}});return true}catch(e){return false}
}
const L={el:document.getElementById('lock'),mode:'unlock',buf:'',tmp:'',after:null};
const LD=document.getElementById('lkD'),LM=document.getElementById('lkM'),LT=document.getElementById('lkT');
(function(){
  const P=document.getElementById('lkP');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;
    if(!k){b.className='ghost';b.disabled=true}else if(k==='⌫'){b.className='ghost';b.setAttribute('aria-label','Padam digit');b.onclick=()=>{L.buf=L.buf.slice(0,-1);lkDraw()}}else b.onclick=()=>lkKey(k);P.appendChild(b)});
  for(let i=0;i<4;i++)LD.appendChild(document.createElement('i'));
})();
function lkDraw(){[...LD.children].forEach((d,i)=>d.classList.toggle('f',i<L.buf.length))}
const TITLES={unlock:'Masukkan PIN',verify:'Masukkan PIN semasa',set1:'Tetapkan PIN baru',set2:'Masukkan semula PIN'};
function lkShow(mode,after){
  L.mode=mode;L.buf='';L.after=after||null;LT.textContent=TITLES[mode];LM.textContent='';lkDraw();L.el.hidden=false;
  document.getElementById('lkX').hidden=mode==='unlock';
  document.getElementById('lkF').hidden=!(mode==='unlock'&&!localMode&&typeof firebase!=='undefined');
  document.getElementById('lkBio').hidden=!(mode==='unlock'&&lsGet(PK.bio));
  if(mode==='unlock'&&lsGet(PK.bio)&&document.visibilityState==='visible')bioAuth().then(ok=>{if(ok&&L.mode==='unlock')lkOpen()});
}
function lkOpen(){L.el.hidden=true;L.buf='';lkDraw()}
function lkBad(msg){LM.textContent=msg;LD.classList.remove('shake');void LD.offsetWidth;LD.classList.add('shake');L.buf='';setTimeout(lkDraw,380);if(navigator.vibrate)navigator.vibrate(60)}
async function lkKey(d){
  if(L.buf.length>=4)return;L.buf+=d;lkDraw();if(L.buf.length<4)return;
  const pin=L.buf;
  if(L.mode==='unlock'||L.mode==='verify'){
    const ok=(await hashPin(pin,lsGet(PK.salt)||''))===lsGet(PK.pin);
    if(!ok){lkBad('PIN salah');return}
    if(L.mode==='unlock'){lkOpen();return}
    const f=L.after;lkOpen();if(f)f();return}
  if(L.mode==='set1'){L.tmp=pin;L.mode='set2';L.buf='';LT.textContent=TITLES.set2;LM.textContent='';setTimeout(lkDraw,150);return}
  if(L.mode==='set2'){
    if(pin!==L.tmp){L.mode='set1';LT.textContent=TITLES.set1;lkBad('PIN tak sama, cuba lagi');return}
    const salt=Math.random().toString(36).slice(2);lsSet(PK.salt,salt);lsSet(PK.pin,await hashPin(pin,salt));
    lkOpen();later();setUndo('PIN ditetapkan',null);}
}
document.getElementById('lkX').onclick=()=>{lkOpen()};
document.getElementById('lkBio').onclick=()=>{bioAuth().then(ok=>{if(ok)lkOpen();else{LM.textContent='Cap jari gagal, guna PIN'}})};
document.getElementById('lkF').onclick=()=>{
  if(!confirm('Log keluar akaun Google dan buang PIN? Anda perlu log masuk semula.'))return;
  [PK.pin,PK.salt,PK.bio].forEach(lsDel);
  try{firebase.auth().signOut().finally(()=>location.reload())}catch(e){location.reload()}
};
function pinAct(a){
  if(a==='pin-set')lkShow('set1');
  else if(a==='pin-change')lkShow('verify',()=>lkShow('set1'));
  else if(a==='pin-off')lkShow('verify',()=>{[PK.pin,PK.salt,PK.bio].forEach(lsDel);later();setUndo('PIN dibuang',null)});
  else if(a==='pin-bio-on')lkShow('verify',async()=>{const ok=await bioReg();later();setUndo(ok?'Cap jari diaktifkan':'Cap jari tak dapat diaktifkan',null)});
  else if(a==='pin-bio-off'){lsDel(PK.bio);later()}
}
function secPanel(){
  const p=hasPin(),bio=!!lsGet(PK.bio);
  return `<section class="panel">${head('Keselamatan','Kunci app dengan PIN 4 digit. PIN disimpan pada fon ni sahaja, setiap fon ada PIN sendiri.')}
  <div class="kvs">${kv('Kunci PIN',p?'Aktif':'Tak aktif',p?'good':'')}${kv('Cap jari',bio?'Aktif':'Tak aktif',bio?'good':'')}</div>
  <div class="btns">${p?`<button class="btn ghost" data-act="pin-change">Tukar PIN</button><button class="btn ghost" data-act="pin-off">Buang PIN</button>${bioOK()?(bio?'<button class="btn ghost" data-act="pin-bio-off">Matikan cap jari</button>':'<button class="btn ghost" data-act="pin-bio-on">Aktifkan cap jari</button>'):''}`:'<button class="btn" data-act="pin-set">Tetapkan PIN</button>'}</div></section>`;
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(hasPin()&&L.el.hidden&&hiddenAt&&Date.now()-hiddenAt>45000)lkShow('unlock');
});
if(hasPin())lkShow('unlock');

/* ---------- bulan semasa auto-muncul ---------- */
let monthEnsured=false;
function ensureMonth(){
  if(monthEnsured)return;monthEnsured=true;
  const a=state.saving.monthly;if(!a.length)return;
  if(dirty.has('saving')||writing.saving)return;
  const ym=nowYm();if(a.some(x=>x.ym===ym))return;
  a.push({ym,amt:null});touch('saving');
}
/* ---------- leret kiri/kanan tukar tab ---------- */
(function(){
  let x0=0,y0=0,t0=0,ok=false;
  const bad=el=>{for(let e=el;e&&e!==document.body;e=e.parentElement){if(e.classList&&e.classList.contains('nwc'))return true;if(e.scrollWidth>e.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(e).overflowX))return true}return false};
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ok=false;return}
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
    ok=x0>28&&x0<window.innerWidth-28&&!bad(e.target)},{passive:true});
  document.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*2||Date.now()-t0>700)return;
    const i=TABS.indexOf(curTab()),n=i+(dx<0?1:-1);
    if(n<0||n>=TABS.length)return;
    location.hash='#'+TABS[n]},{passive:true});
})();

/* ---------- boot ---------- */
render();
(async()=>{
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){db=false;localMode=true;loaded=true;
    try{const raw=localStorage.getItem(KEY);const src=raw?JSON.parse(raw):SEED;if(src)DOCS.forEach(n=>{if(src[n])state[n]=Object.assign(DEF[n](),src[n])});dbErr='Mod peranti: data disimpan dalam browser ni sahaja dan tak sync dengan peranti lain. Guna Simpan fail untuk sandaran.'}
    catch(e){if(SEED)DOCS.forEach(n=>{if(SEED[n])state[n]=Object.assign(DEF[n](),SEED[n])});dbErr='Browser ni tak benarkan simpan data, jadi ubahan hilang bila ditutup. Guna Simpan fail untuk sandaran.'}
    ensureMonth();setSync('ok','Mod peranti');later();return}
  db.collection('m').onSnapshot(snap=>{
    snap.docs.forEach(doc=>{
      const n=doc.id;if(!DOCS.includes(n))return;
      if(dirty.has(n)||writing[n])return;
      const raw=JSON.stringify(doc.data());if(raw===last[n])return;
      last[n]=raw;state[n]=Object.assign(DEF[n](),JSON.parse(raw));
    });
    loaded=true;if(!snap.metadata.fromCache&&snap.docs.some(d=>d.id==='saving'))ensureMonth();if(!dirty.size)setSync('ok','Tersimpan');
    const ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.dataset.k){ae.addEventListener('blur',()=>later(),{once:true})}else later();
  },err=>{loaded=true;dbErr='Data tak dapat dimuat ('+(err&&err.code||'ralat')+').';setSync('err','Ralat');later()});
})();
})();
</script>
