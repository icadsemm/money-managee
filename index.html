<title>Money Manage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead, one-column mobile app, bottom tab bar. Emerald is the single accent; amber/red only for status. */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface2:#F7F9F8;--ink:#0F172A;--mute:#5B6B7A;--line:#E1E8E4;
  --navy:#0F172A;--on-navy:#FFFFFF;--navy-mute:#94A3B8;
  --accent:#059669;--accent-ink:#FFFFFF;--mint:#34D399;--tint:#E6F7EF;
  --input:#2563EB;--good:#15803D;--warn:#B45309;--bad:#DC2626;--warn-tint:#FEF3C7;--bad-tint:#FEE2E2;
  --track:#E2E8E5;
  --display:'AppleEmoji','Bricolage Grotesque','Manrope',system-ui,sans-serif;--body:'AppleEmoji','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1210;--surface:#121C18;--surface2:#0F1814;--ink:#E7EEEA;--mute:#8FA39A;--line:#22312B;
  --navy:#07100D;--on-navy:#F1F7F4;--navy-mute:#8FA39A;
  --accent:#34D399;--accent-ink:#04130C;--mint:#34D399;--tint:#10261D;
  --input:#7FAAFF;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--warn-tint:#3A2A0A;--bad-tint:#3A1414;
  --track:#1F2E28;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1210;--surface:#121C18;--surface2:#0F1814;--ink:#E7EEEA;--mute:#8FA39A;--line:#22312B;
  --navy:#07100D;--on-navy:#F1F7F4;--navy-mute:#8FA39A;
  --accent:#34D399;--accent-ink:#04130C;--mint:#34D399;--tint:#10261D;
  --input:#7FAAFF;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--warn-tint:#3A2A0A;--bad-tint:#3A1414;
  --track:#1F2E28;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.num,.big,.kv b,.in{font-variant-numeric:tabular-nums}

/* masthead */
.top{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--mint)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:14px}
.top h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--navy-mute);font-size:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--navy-mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--navy-mute)}
.sync[data-s="ok"] i{background:var(--mint)}.sync[data-s="saving"] i{background:#FBBF24}.sync[data-s="err"] i{background:#F87171}

main{padding-top:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.005em}
.eyebrow{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hint{margin:2px 0 0;font-size:12px;color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600}
.empty{margin:0;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);font-size:12.5px;text-align:center}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{color:var(--navy-mute)}
.hero .big{font-family:var(--display);font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em}
.lvl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em}
.lvl-ic{font-size:20px}
.hero .bar{background:rgba(255,255,255,.14)}
.hero p{margin:0;color:var(--navy-mute);font-size:12.5px}
.quote{margin:0;font-size:12.5px;color:var(--mute);padding:0 4px}

.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;min-width:0}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}

/* attention list */
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att a{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.att li:first-child a{border-top:0;padding-top:2px}
.att .dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.att [data-s="good"] .dot{background:var(--good)}.att [data-s="warn"] .dot{background:var(--warn)}.att [data-s="bad"] .dot{background:var(--bad)}
.att b{display:block;font-weight:600}.att small{color:var(--mute);font-size:12px}
.att svg{width:16px;height:16px;stroke:var(--mute)}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;min-width:0}
.mod .v{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.mod small{color:var(--mute);font-size:12px}
.mod.hi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mod.hi small,.mod.hi .eyebrow{color:inherit;opacity:.8}
.mod.neg .v{color:var(--bad)}

/* key/value */
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.kv b{display:block;font-family:var(--display);font-size:18px;margin-top:2px;overflow-wrap:anywhere}

/* inputs: blue text = editable (same convention as the Excel files) */
.in{font:inherit;color:var(--input);background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:9px 2px;min-height:40px;width:100%;min-width:0;outline:0}

.lab{display:flex;flex-direction:column;gap:0;min-width:0;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.lab .in{font-size:14px;letter-spacing:0;text-transform:none;font-weight:600}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 112px 36px;gap:8px;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.chk{grid-template-columns:34px minmax(0,1fr) 108px 36px}
.row.note{grid-template-columns:minmax(0,1fr) 36px}
.row .pc{grid-column:2/-1;font-size:11.5px;color:var(--mute);text-align:right;margin-top:-6px;padding-bottom:6px}
.row.chk .pc{grid-column:2/-1}
.tick{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:transparent;cursor:pointer;display:grid;place-content:center;margin:0 auto}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:focus-visible,.btn:focus-visible,.tabs a:focus-visible,.seg button:focus-visible,.mod:focus-visible,.att a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.paid .in.t{text-decoration:line-through;color:var(--mute)}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:10px;padding:12px 14px;font-weight:700}
.total b{font-family:var(--display);font-size:18px;color:var(--accent)}

.btn{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:10px 14px;min-height:40px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.x{background:transparent;color:var(--mute);padding:0;width:36px;min-height:36px;font-size:18px;line-height:1;border-radius:8px}
.btn.x[data-armed]{background:var(--bad-tint);color:var(--bad);width:auto;padding:0 8px;font-size:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* account cards */
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.acc-h{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:8px;align-items:center}
.acc-h.lg{grid-template-columns:42px minmax(0,1fr) 36px}
.logo{width:42px;height:42px;border-radius:11px;border:1px dashed var(--mute);display:grid;place-content:center;overflow:hidden;cursor:pointer;background:var(--surface);color:var(--mute);font-size:20px;line-height:1}
.logo.has{border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;color:var(--mute);font-size:11.5px;text-decoration:underline;cursor:pointer;margin-left:auto}
.acc-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.res b{font-weight:700}.pos{color:var(--good)}.neg{color:var(--bad)}
.share{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute)}.share .bar{flex:1;height:6px}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:12px}
.lv{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.lv .ic{font-size:20px;text-align:center;grid-row:1/3}
.lv .nm{font-weight:700}.lv .nm small{color:var(--mute);font-weight:500;margin-left:6px}
.lv .st{font-size:11.5px;font-weight:700;color:var(--mute)}
.lv.done .st{color:var(--good)}.lv.next .st{color:var(--accent)}
.lv .bar{grid-column:2/4;height:7px}
.lv.lock{opacity:.6}

/* month bars */
.mbars{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative;padding-top:6px;border-bottom:1px solid var(--line)}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mb i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--mint);min-height:2px}
.mb.low i{background:var(--warn)}
.mb span{font-size:10px;color:var(--mute);position:absolute;bottom:-18px;white-space:nowrap}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute);opacity:.6}
.goal em{position:absolute;right:0;top:-16px;font-style:normal;font-size:10px;color:var(--mute)}
.mlab{display:flex;gap:6px;margin-top:6px}.mlab span{flex:1;text-align:center;font-size:10px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) 100px 36px;gap:8px;align-items:center;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ml{font-weight:700}.mrow .md{text-align:right;font-size:11.5px;color:var(--mute);white-space:nowrap}
.mrow.h{grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 70px 36px}
.mrow.h .md{font-size:11.5px}
.mrow.dl{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.8fr) 36px}
.tbl-h{display:grid;gap:8px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding-bottom:4px}
.scroll{overflow-x:auto}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--mute);border-radius:9px;padding:10px;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--tint);color:var(--good)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}.pill.bad{background:var(--bad-tint);color:var(--bad)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:10.5px;font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--tint)}
@media (min-width:560px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:760px){.kvs.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.bar i,.mb i{transition:width .5s ease,height .5s ease}}
/* net worth chart */
.seg.s4{grid-template-columns:repeat(4,1fr)}.seg.s4 button{padding:8px 2px;min-height:38px;font-size:12.5px}
.nwc{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.nwr{font-size:12.5px;color:var(--mute);min-height:34px;line-height:1.35}.nwr b{color:var(--ink)}
.nwc svg{display:block;width:100%;height:auto;overflow:visible}
.nwc text{font-family:var(--body);font-size:9px;fill:var(--mute)}
.nwleg{display:flex;gap:14px;font-size:11.5px;color:var(--mute)}.nwleg i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:5px}.nwleg i.m{border-top:2px dashed var(--mute)}

/* ===== Liquid glass + animasi ===== */
:root{--g-bg:rgba(255,255,255,.58);--g-bg2:rgba(255,255,255,.30);--g-brd:rgba(255,255,255,.75);--g-hi:rgba(255,255,255,.9);--g-lo:rgba(255,255,255,.25);--g-sh:rgba(15,23,42,.10);--g-thumb:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:rgba(24,38,32,.55);--g-bg2:rgba(24,38,32,.30);--g-brd:rgba(255,255,255,.14);--g-hi:rgba(255,255,255,.22);--g-lo:rgba(255,255,255,.04);--g-sh:rgba(0,0,0,.35);--g-thumb:rgba(60,90,76,.75)}}
:root[data-theme="dark"]{--g-bg:rgba(24,38,32,.55);--g-bg2:rgba(24,38,32,.30);--g-brd:rgba(255,255,255,.14);--g-hi:rgba(255,255,255,.22);--g-lo:rgba(255,255,255,.04);--g-sh:rgba(0,0,0,.35);--g-thumb:rgba(60,90,76,.75)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 38% at 8% 2%,rgba(52,211,153,.30),transparent 70%),radial-gradient(50% 34% at 100% 32%,rgba(96,165,250,.24),transparent 70%),radial-gradient(60% 38% at 25% 100%,rgba(167,139,250,.20),transparent 70%)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.mod{background:linear-gradient(145deg,var(--g-bg),var(--g-bg2));border:1px solid var(--g-brd);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 10px 28px -10px var(--g-sh)}
  .seg{background:linear-gradient(145deg,var(--g-bg2),var(--g-lo));border:1px solid var(--g-brd);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 4px 14px -6px var(--g-sh)}
  .seg button[aria-pressed="true"]{background:linear-gradient(160deg,var(--g-thumb),var(--g-bg));
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 4px 12px -2px var(--g-sh),0 0 0 1px var(--g-brd)}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--navy) 66%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  .tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:26px;max-width:736px;margin:0 auto;
    background:linear-gradient(145deg,var(--g-bg),var(--g-bg2));border:1px solid var(--g-brd);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 14px 34px -8px var(--g-sh)}
  .tabs a{border-radius:20px}
  .tabs a[aria-current="page"]{background:linear-gradient(160deg,var(--g-thumb),var(--g-bg2));box-shadow:inset 0 1px 0 var(--g-hi),0 4px 12px -3px var(--g-sh)}
  main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
.tabs a[aria-current="page"] svg{animation:popS .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes popS{0%{transform:scale(.88)}100%{transform:scale(1)}}
.tabs a,.seg button,.btn{transition:transform .15s ease,background .25s ease,color .25s ease}
.tabs a:active,.seg button:active,.btn:active{transform:scale(.94)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.07s}main.enter>*:nth-child(3){animation-delay:.14s}main.enter>*:nth-child(4){animation-delay:.21s}
main.enter>*:nth-child(5){animation-delay:.28s}main.enter>*:nth-child(6){animation-delay:.35s}main.enter>*:nth-child(n+7){animation-delay:.42s}
/* kotak dalam kad: kaca */
.acc,.kv{background:linear-gradient(145deg,var(--g-in1),var(--g-in2));border:1px solid var(--g-brd);border-radius:16px;
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 8px 20px -10px var(--g-sh)}
.acc{padding:14px}
:root{--g-in1:rgba(255,255,255,.80);--g-in2:rgba(255,255,255,.38)}

:root[data-theme="dark"]{--g-in1:rgba(40,62,52,.62);--g-in2:rgba(24,38,32,.30)}
/* fon kotak dalam sama macam kad ringkasan */
.acc .lab .in.n{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}

.acc .lab{font-size:10.5px;letter-spacing:.09em}
.acc .res b{font-family:var(--display);font-size:15px;letter-spacing:-.005em}
.acc .share span{font-size:12px}
main.enter.fwd>*{animation-name:slideF}main.enter.back>*{animation-name:slideB}
@keyframes slideF{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
/* menu bawah: lebih jelas + masuk dari bawah */

  background:linear-gradient(160deg,var(--nav1),var(--nav2));border:1px solid var(--g-brd);
  box-shadow:inset 0 1px 0 var(--g-hi),0 14px 34px -8px var(--g-sh);
  animation:navUp .7s cubic-bezier(.2,.9,.3,1) 1s both}

/* elak halaman terlebar semasa luncur */
html,body{overflow-x:clip;max-width:100%}.wrap,main{overflow-x:clip}

/* ===== fungsi baru ===== */
.seg.s3{grid-template-columns:repeat(3,1fr)}.seg.s3 button{padding:8px 2px;min-height:38px;font-size:12.5px}
.dl{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--mute) 14%,transparent);color:var(--mute);white-space:nowrap}
.dl.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.dl.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cmp:first-of-type{border-top:0}.cmp .cl{font-size:12.5px;color:var(--mute);font-weight:600}.cmp .cv{font-family:var(--display);font-weight:700;font-size:15px;text-align:right}

.ring{width:76px;height:76px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .rt{stroke:var(--track)}.ring .rp{stroke:var(--accent);transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ring text{transform:rotate(90deg);transform-origin:32px 32px;font-family:var(--display);font-weight:700;font-size:13px;fill:var(--ink);stroke:none}
.gr{display:flex;flex-direction:column;gap:6px;min-width:0}.gr small{color:var(--mute)}
select.in{appearance:none;-webkit-appearance:none;background:transparent;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
.calh{display:flex;align-items:center;justify-content:space-between}.calh b{font-size:15px}.calh .btn{min-width:44px;font-size:18px;padding:6px 12px}
.calt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.calt b{font-size:24px}.calt small{color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal em{font-style:normal;font-size:10.5px;text-align:center;color:var(--mute);font-weight:700}
.cd{font:inherit;font-weight:700;font-size:13px;aspect-ratio:1;border:0;border-radius:10px;cursor:pointer;background:var(--track);color:var(--mute);padding:0}
.cd.g{background:var(--good);color:#fff}.cd.r{background:var(--bad);color:#fff}

.calb{display:flex;flex-direction:column;gap:8px}
.dvc{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:18px}

.dvb i.neg{background:linear-gradient(180deg,#F87171,var(--bad))}
.dvb span{font-size:9.5px;color:var(--mute);font-weight:700;white-space:nowrap}.dvb em{font-style:normal;font-size:9.5px;color:var(--mute)}
@keyframes grow{from{transform:scaleY(.05);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:40;display:flex;align-items:center;gap:12px;
  background:rgba(15,23,42,.88);color:#fff;border-radius:99px;padding:8px 8px 8px 16px;font-size:13px;font-weight:600;box-shadow:0 10px 30px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 28px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{white-space:nowrap}#toast button{white-space:nowrap;font:inherit;font-weight:800;border:0;border-radius:99px;background:var(--mint);color:#04130C;padding:8px 14px;cursor:pointer}

.lk{width:min(320px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}

.dots.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:6px}

.kv>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== tab tambahan ===== */
.tabs>div{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:2px;-webkit-overflow-scrolling:touch}
.tabs>div::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 60px;min-width:0}
.tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs a .ci{font-size:20px;line-height:22px;height:22px;max-width:none}
.tabs a.addtab{flex:0 0 54px;color:var(--accent)}
.tabs a.addtab svg{stroke-width:2.2}
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(7,16,13,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.shc{width:min(520px,100%);background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sheetUp .4s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.shc h2{margin:0}.emj{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:200px;overflow-y:auto;padding:2px;overscroll-behavior:contain}
.emj button{font-size:22px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;height:46px;cursor:pointer}
.emj button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 2px var(--accent) inset}
.shc .in{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.ctt{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:end}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g-brd,var(--line));border-radius:99px;padding:9px 14px;font:700 13.5px var(--body);color:var(--ink);cursor:pointer;
  background:linear-gradient(145deg,var(--g-in1,var(--surface2)),var(--g-in2,var(--surface2)));box-shadow:inset 0 1px 0 var(--g-hi,transparent),0 4px 12px -6px var(--g-sh,transparent);transition:transform .15s}
.cat span{font-size:17px;line-height:1}.cat:active{transform:scale(.93)}
.cat.edit{border-color:var(--bad);color:var(--bad)}.cat.add{border-style:dashed;color:var(--accent)}
#rcp[hidden]{display:none}
#rcp{position:fixed;inset:0;z-index:60;background:rgba(7,16,13,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.rl{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
.rr{display:grid;grid-template-columns:26px minmax(0,1fr) 84px;gap:6px 8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2)}
.rr .in{border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 2px;background:transparent;min-height:0}
.rr select.in{grid-column:2/4;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
#rcp{background:rgba(7,16,13,.38);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4)}
#rcp .shc{background:color-mix(in srgb,var(--surface) 76%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);border:1px solid rgba(255,255,255,.42);border-bottom:0;box-shadow:0 -18px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.scn{position:relative;height:220px;border-radius:20px;overflow:hidden;background:#0b1510;border:1px solid rgba(255,255,255,.35);box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4);transition:height .6s cubic-bezier(.2,.9,.3,1)}
.scn[hidden]{display:none}.scn img{width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.7) saturate(1.1);transform:scale(1.04);transition:filter .6s,transform .6s}
.scn::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(180deg,rgba(0,0,0,.2),transparent 35%,transparent 65%,rgba(0,0,0,.3));pointer-events:none;z-index:1}
.scn .ln{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#fff,var(--accent),#fff,transparent);box-shadow:0 0 16px 3px rgba(52,211,153,.8),0 0 44px 8px rgba(52,211,153,.25);animation:scanln 2.6s cubic-bezier(.45,.05,.55,.95) infinite alternate;z-index:3}
.scn .ln::before{content:"";position:absolute;left:0;right:0;bottom:3px;height:70px;background:linear-gradient(to top,rgba(52,211,153,.32),transparent)}
.scn .cn{position:absolute;width:24px;height:24px;border:3px solid #fff;z-index:3;border-radius:6px;opacity:.9;animation:cnp 1.4s ease-in-out infinite alternate}
.cn.a{left:10px;top:10px;border-right:0;border-bottom:0}.cn.b{right:10px;top:10px;border-left:0;border-bottom:0}.cn.c{left:10px;bottom:10px;border-right:0;border-top:0}.cn.d{right:10px;bottom:10px;border-left:0;border-top:0}
.cam{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;z-index:4;transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1)}
.cam .aura{position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.24),transparent 66%);animation:brt 4.2s ease-in-out infinite}
.cam .rg{position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.cam .rim{position:absolute;inset:-9px;border-radius:50%;padding:1.5px;background:conic-gradient(from 0deg,transparent 0 58%,rgba(110,231,183,.9) 94%,#fff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:cspin 3.2s cubic-bezier(.45,.05,.55,.95) infinite}
.cam .core{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;background:radial-gradient(120% 120% at 30% 12%,rgba(255,255,255,.34),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),linear-gradient(160deg,rgba(14,58,44,.62),rgba(4,28,21,.8));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -14px 22px rgba(0,0,0,.28),0 18px 40px rgba(0,0,0,.42),0 0 0 6px rgba(255,255,255,.05)}
.cam .core svg{position:relative;z-index:1;width:58px;height:58px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.cam .irs{transform-origin:32px 32px;animation:iris 5s cubic-bezier(.65,0,.35,1) infinite}
.cam .dot{animation:brt 2.6s ease-in-out infinite;transform-origin:32px 32px}
.cam .gl{position:absolute;top:-30%;bottom:-30%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);transform:skewX(-18deg);animation:glint 4.6s ease-in-out 1s infinite;z-index:2;pointer-events:none}
@keyframes brt{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes iris{from{transform:rotate(0)}to{transform:rotate(60deg)}}
@keyframes glint{0%,55%{left:-60%}100%{left:130%}}
@keyframes cspin{to{transform:rotate(360deg)}}
.scn.fail .cam .rim,.scn.fail .cam .irs,.scn.fail .cam .aura{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.cam .aura,.cam .rim,.cam .irs,.cam .dot,.cam .gl{animation:none}}
.scn .shn{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);transform:translateX(-110%);animation:shn 2.6s ease-in-out infinite}
.okc{position:absolute;right:10px;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:linear-gradient(145deg,#34d399,#059669);display:grid;place-items:center;z-index:6;transform:scale(0);box-shadow:0 6px 20px rgba(5,150,105,.55)}.okc svg{width:20px;height:20px}
.scn.done{height:76px}.scn.done img{filter:none;transform:scale(1)}.scn.done .ln,.scn.done .shn,.scn.done .cn{animation:none;opacity:0}.scn.done .cam{opacity:0;transform:scale(.3);animation:none}
.scn.done .okc{animation:pop .55s .2s cubic-bezier(.2,1.6,.4,1) both}
.scn.fail .ln,.scn.fail .shn,.scn.fail .cam .rg{animation:none;opacity:0}
@keyframes scanln{from{top:0}to{top:calc(100% - 3px)}}@keyframes cnp{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes rg{from{transform:scale(1);opacity:.75}to{transform:scale(2.4);opacity:0}}@keyframes cfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes lns{from{opacity:.35;transform-origin:24px 25px;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}@keyframes shn{0%{transform:translateX(-110%)}60%,100%{transform:translateX(110%)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes bsh{to{background-position:-200% 0}}
#rcpB i{background:linear-gradient(90deg,var(--accent),#8ff5cb,var(--accent));background-size:200% 100%;animation:bsh 1.1s linear infinite}
.btn.scanbtn{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:12px 16px;border:1px solid rgba(255,255,255,.5);border-radius:20px;color:#fff;text-align:left;cursor:pointer;background:linear-gradient(120deg,#047857,#10b981,#0d9488,#047857);background-size:260% 100%;animation:sbg 6s ease-in-out infinite alternate,sglow 2.4s ease-in-out infinite alternate;box-shadow:0 10px 26px rgba(5,150,105,.38),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 18px rgba(0,0,0,.08);transition:transform .15s}
.btn.scanbtn:active{transform:scale(.97)}
.scanbtn .sbi{position:relative;flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;overflow:visible;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.18);animation:sbob 2.2s ease-in-out infinite}
.scanbtn .sbi svg{width:27px;height:27px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}.scanbtn .lens{fill:#fff;transform-origin:24px 25px;animation:lns 1.2s ease-in-out infinite alternate}
.scanbtn .sbi::before{content:"";position:absolute;inset:-1px;border-radius:15px;border:2px solid rgba(255,255,255,.75);animation:srg 2s ease-out infinite;pointer-events:none}
.scanbtn .sl{position:absolute;left:7px;right:7px;top:9px;height:2px;border-radius:2px;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.9);animation:ssl 1.6s ease-in-out infinite alternate}
.scanbtn .sbt{display:flex;flex-direction:column;gap:2px;line-height:1.15;font-size:15.5px}.scanbtn .sbt small{font-weight:500;opacity:.88;font-size:11.5px}
.scanbtn .sbs{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);animation:sshn 3.2s ease-in-out infinite}
@keyframes sbg{to{background-position:100% 0}}@keyframes sglow{from{box-shadow:0 8px 20px rgba(5,150,105,.3),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 18px rgba(0,0,0,.08)}to{box-shadow:0 12px 34px rgba(16,185,129,.6),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 18px rgba(0,0,0,.08)}}
@keyframes sbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}@keyframes srg{from{transform:scale(1);opacity:.8}to{transform:scale(1.55);opacity:0}}
@keyframes ssl{from{top:9px}to{top:36px}}@keyframes sshn{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.btn.scanbtn,.scanbtn .sbi,.scanbtn .sbi::before,.scanbtn .sl,.scanbtn .sbs,.scanbtn .lens{animation:none}}
.stp{display:flex;gap:6px}.stp span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:7px 4px;border-radius:99px;background:rgba(130,150,140,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--mute);transition:all .35s}
.stp span.on{background:linear-gradient(135deg,var(--accent),#34d399);color:var(--accent-ink);box-shadow:0 4px 14px rgba(5,150,105,.35)}
.rr{animation:rin .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--n,0)*90ms)}
@keyframes rin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:var(--o,1);transform:none}}
.rr.off{--o:.45}.still .rr{animation:none}#rcpW.neg{color:var(--bad);font-weight:700}#rcpW.pos{color:var(--good);font-weight:700}
.r2{grid-column:2/4;display:flex;gap:8px;align-items:center}.r2 select.in{flex:1;min-width:0}
.qt{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--mute)}.qt input.in{width:50px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px}
@media (prefers-reduced-motion:reduce){.scn .ln,.scn .cn,.scn .shn,.cam,.cam::before,.cam .orb,.cam .halo,.cam .rg,.cam .lens,#rcpB i,.rr{animation:none}}
.rr.off{opacity:.45}.rtot{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}
/* tajuk */
.top h1 .ch{display:inline-block;opacity:0;animation:chIn .7s cubic-bezier(.2,.8,.2,1) forwards,chWave 6s ease-in-out 2s 2;animation-delay:calc(var(--i)*45ms + .9s),calc(var(--i)*70ms + 2.2s)}
.top h1 .sp{display:inline-block;width:.28em}
@keyframes chIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes chWave{0%,18%,100%{transform:none;color:inherit}6%{transform:translateY(-3px);color:var(--mint)}12%{transform:none}}
/* splash */
#splash{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 44%,#14301F 0,#0F172A 58%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;animation:splashOut .45s ease 1.75s forwards}
#splash img{width:96px;height:96px;border-radius:26px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 56px 4px rgba(52,211,153,.32);opacity:0;transform:scale(.6);animation:spLogo .8s cubic-bezier(.2,1.25,.3,1) .05s forwards}
#splash b{display:flex;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.015em}
#splash b i{font-style:normal;white-space:pre;opacity:0;transform:translateY(16px);animation:spLet .6s cubic-bezier(.2,.9,.25,1) calc(.4s + var(--i)*48ms) forwards}
#splash u{display:block;height:3px;width:64px;border-radius:3px;background:linear-gradient(90deg,#34D399,#059669);transform:scaleX(0);transform-origin:left;opacity:.9;animation:spBar .7s cubic-bezier(.3,.8,.2,1) 1.05s forwards}
@keyframes spLogo{to{opacity:1;transform:none}}
@keyframes spLet{to{opacity:1;transform:none}}
@keyframes spBar{to{transform:scaleX(1)}}
@keyframes splashOut{to{opacity:0;visibility:hidden;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){#splash img,#splash b i,#splash u{animation-duration:.01s;animation-delay:0s}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.top h1 .ch{opacity:1}}
.edtx{margin:10px 0 2px}.edtx summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px;padding:6px 0;min-height:32px}.edtx .lab{margin-top:10px}

/* ---- Setting ---- */
.topr{display:flex;align-items:center;gap:10px}
#setBtn{width:40px;height:40px;border-radius:13px;border:1px solid color-mix(in srgb,var(--on-navy) 20%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--on-navy) 16%,transparent),color-mix(in srgb,var(--on-navy) 5%,transparent));color:var(--on-navy);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--on-navy) 22%,transparent),0 4px 14px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .3s}
#setBtn svg{width:21px;height:21px;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
#setBtn:hover svg{transform:rotate(30deg)}
#setBtn:active{transform:scale(.92)}
#setBtn.on svg{transform:rotate(90deg)}
#setBtn:focus-visible,.mmseg button:focus-visible,#setX:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#set[hidden]{display:none}
#set{position:fixed;inset:0;z-index:70;background:rgba(7,16,13,0);display:flex;align-items:flex-end;justify-content:center;animation:none;transition:background .35s ease}
#set.open{background:rgba(7,16,13,.5)}
#set .setsheet{width:min(520px,100%);max-height:92vh;overflow:auto;gap:18px;animation:none;transform:translateY(105%);transition:transform .5s cubic-bezier(.22,1.1,.36,1);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding-top:10px}
#set.open .setsheet{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-bottom:2px}
#set h2{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:-.01em}
#set h2 .tile{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(145deg,var(--mint),var(--accent));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
#set h2 .tile svg{width:19px;height:19px;transition:transform 1s cubic-bezier(.3,1.2,.5,1)}
#set.open h2 .tile svg{transform:rotate(180deg)}
.setg,#setX{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .6s cubic-bezier(.22,1.1,.36,1);transition-delay:calc(var(--d,0)*70ms + 160ms)}
#set.open .setg,#set.open #setX{opacity:1;transform:none}
.setg{display:flex;flex-direction:column;gap:9px}
.setg>b{font-size:12.5px;color:var(--mute);font-weight:700;letter-spacing:.02em;padding-left:2px}
.mmseg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:18px;background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid var(--line)}
.mmseg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:14px;background:var(--surface);box-shadow:0 2px 4px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.14),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent);transform:translateX(calc(var(--i)*100%));transition:transform .55s cubic-bezier(.34,1.45,.5,1)}
.mmseg button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:13px 4px;border:0;background:none;color:var(--mute);font:600 12.5px var(--body);cursor:pointer;border-radius:14px;transition:color .35s ease;-webkit-tap-highlight-color:transparent}
.mmseg button span,.mmseg button em{font-style:normal}
.mmseg button svg{width:24px;height:24px;transition:transform .7s cubic-bezier(.3,1.35,.5,1)}
.mmseg button svg .ry{transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.mmseg button[aria-pressed="true"]{color:var(--accent)}
.mmseg button[aria-pressed="true"] svg{transform:scale(1.12) rotate(var(--rot,0deg))}
.mmseg button[aria-pressed="true"] svg .ry{transform:rotate(45deg)}
.mmseg button:active svg,.mmseg button:active em{transform:scale(.88)}
.mmseg button em{min-width:34px;padding:4px 8px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.04em;background:color-mix(in srgb,var(--ink) 9%,transparent);transition:background .35s,color .35s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.mmseg button[aria-pressed="true"] em{background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
#setX{border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--mint),var(--accent));color:var(--accent-ink);font:800 14.5px var(--body);cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent)}
#set.open #setX{transition:opacity .5s ease,transform .6s cubic-bezier(.22,1.1,.36,1),box-shadow .2s;}
#setX:active{transform:scale(.97)!important}
/* ---- Suara ---- */
.btn.voicebtn{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:10px 16px;border-radius:20px;text-align:left;background:var(--surface2);color:var(--ink);border:1px solid var(--line);transition:transform .15s,background .25s,border-color .25s}
.btn.voicebtn:active{transform:scale(.97)}
.voicebtn .vbi{position:relative;flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);transition:background .25s,color .25s}
.voicebtn .vbi svg{width:26px;height:26px}
.voicebtn .vbt{display:flex;flex-direction:column;gap:2px;line-height:1.15;min-width:0}

  let best=null;s.monthly.forEach(m=>{if(m.amt>0&&(!best||m.amt>best.amt))best=m});C.best=best;
  const tm=s.monthly.find(m=>m.ym===cur);C.thisMonth=tm&&tm.amt?tm.amt:0;C.thisGap=Math.max(s.goal-C.thisMonth,0);

  C.dDays=dr.filter(r=>r.inc>0).length;C.dAvg=C.dDays?C.dInc/C.dDays:0;C.dMax=dr.reduce((m,r)=>Math.max(m,(Number(r.inc)||0)*fx(r)),0);

  {const b=state.belanja,td=todayISO();C.bMonth=sum(b.rows.filter(r=>(r.d||'').slice(0,7)===cur),r=>r.amt);C.bToday=sum(b.rows.filter(r=>r.d===td),r=>r.amt)}

  return C;
}

const okLogo=v=>typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(v);
async function toLogo(file){
  let src,w,h,rev=()=>{};
  try{src=await createImageBitmap(file);w=src.width;h=src.height}
  catch(e){const u=URL.createObjectURL(file);src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u});w=src.naturalWidth;h=src.naturalHeight;rev=()=>URL.revokeObjectURL(u)}
  const m=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=96;
  const g=c.getContext('2d');g.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,96,96);rev();
  const out=c.toDataURL('image/png');return out.length>60000?c.toDataURL('image/jpeg',.8):out;
}

function dvCal(){

/* ---------- suara: sebut nama + harga, terus catat belanja ---------- */
const vc={on:false,txt:'',rec:null,got:false,err:'',edit:null};
const V_UNI={kosong:0,satu:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,lapan:8,lepan:8,sembilan:9,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
const V_SPC=/^(sepuluh|sebelas|seratus|seribu)$/,V_MUL=/^(belas|puluh|ratus|ribu)$/;
const V_FILL=new Set(['ringgit','rm','sen','dan','tadi','beli','bayar','harga','sebanyak','je','saja','sahaja','untuk','aku','saya','ambe','la','lah','tu','ni','dekat','kat','di','pada','belanja','catat','tambah','masuk']);
const V_SYN={makan:'nasi mee roti sarapan lunch dinner breakfast burger ayam',minum:'teh milo jus sirap',kopi:'coffee',minyak:'petrol',parking:'toll',ubat:'farmasi',topup:'reload top',bil:'tnb syabas wifi internet elektrik letrik'};
function vNorm(s){return String(s).toLowerCase()
  .replace(/rm\s*(\d)/g,'ringgit $1').replace(/(\d)\s*rm\b/g,'$1 ringgit')
  .replace(/(\d),(\d{1,2})(?!\d)/g,'$1.$2')
  .replace(/[^a-z0-9.\s]/g,' ').replace(/\.(?!\d)/g,' ').replace(/(\d)\.(?!\d)/g,'$1 ')
  .split(/\s+/).filter(Boolean)}
function vNums(ws){
  const out=[],isN=(w,k)=>w==='kosong'?/^(koma|point|perpuluhan)$/.test(ws[k-1]||''):(w in V_UNI)||V_SPC.test(w)||V_MUL.test(w);let i=0;
  while(i<ws.length){
    const w=ws[i];
    if(/^\d+(\.\d+)?$/.test(w)){out.push({n:parseFloat(w)});i++;continue}
    if(isN(w,i)&&!V_MUL.test(w)){
      let total=0,cur=0;
      while(i<ws.length&&isN(ws[i],i)){
        const x=ws[i],nx=ws[i+1];
        if(x==='sepuluh'){cur+=10;i++}
        else if(x==='sebelas'){cur+=11;i++}
        else if(x==='seratus'){total+=100;i++}
        else if(x==='seribu'){total+=1000;i++}
        else if(x in V_UNI){const v=V_UNI[x];
          if(nx==='belas'){cur+=10+v;i+=2}
          else if(nx==='puluh'){cur+=v*10;i+=2}
          else if(nx==='ratus'){total+=(cur+v)*100;cur=0;i+=2}
          else if(nx==='ribu'){total+=(cur+v)*1000;cur=0;i+=2}
          else{cur+=v;i++}}
        else break}
      out.push({n:total+cur});continue}
    out.push({w});i++}
  return out}
function dayISO(off){const t=new Date(todayISO()+'T00:00:00');t.setDate(t.getDate()+off);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function vDay(ws){
  let off=null;const o=[];
  for(let i=0;i<ws.length;i++){
    const w=ws[i],n=ws[i+1],n2=ws[i+2],lp=/^(lepas|lalu)$/;
    if(w==='semalam'||w==='kelmarin'||w==='kemarin'){off=-1;continue}
    if(w==='hari'&&(n==='ni'||n==='ini')){off=0;i++;continue}
    if(w==='minggu'&&lp.test(n||'')){off=-7;i++;continue}
    if(w==='hari'&&(lp.test(n||'')||(n==='yang'&&lp.test(n2||'')))){
      const q=o[o.length-1];let k=null;
      if(q!=null){if(/^\d+$/.test(q))k=+q;else if(q in V_UNI)k=V_UNI[q];else if(q==='sepuluh')k=10}
      if(k){o.pop();off=-k;i+=(n==='yang'?2:1);continue}}
    o.push(w)}
  return [o,off]}
function vParse(s){
  const [ws0,off0]=vDay(vNorm(s));
  const T=vNums(ws0);
  for(let i=1;i<T.length-1;i++){const a=T[i-1],k=T[i],b=T[i+1];
    if(a.n!=null&&k.w&&/^(koma|point|perpuluhan)$/.test(k.w)&&b.n!=null){T.splice(i-1,3,{n:parseFloat(a.n+'.'+b.n)});i--}}
  const A=[];let end=0;
  for(let i=0;i<T.length;i++){
    if(T[i].n==null)continue;
    let v=T[i].n,s0=i,j=i+1,cur=false;
    if(T[j]&&T[j].w==='setengah'){v+=.5;j++}
    if(T[j]&&T[j].w==='ringgit'){cur=true;j++}
    else if(s0>end&&T[s0-1]&&T[s0-1].w==='ringgit'){cur=true;s0--}
    if(cur&&T[j]&&T[j].w==='setengah'){v+=.5;j++}
    if(cur&&T[j]&&T[j].n!=null&&T[j+1]&&T[j+1].w==='sen'){v+=T[j].n/100;j+=2}
    else if(!cur&&T[j]&&T[j].w==='sen'){v=v/100;j++}
    A.push({v:Math.round(v*100)/100,s:s0,e:j});end=j;i=j-1}
  const W=(a,b)=>T.slice(a,b).filter(x=>x.w).map(x=>x.w),items=[];
  if(!A.length)items.push({w:W(0,T.length),amt:null});
  else if(A.length===1)items.push({w:W(0,A[0].s).concat(W(A[0].e,T.length)),amt:A[0].v});
  else if(A[0].s===0)A.forEach((a,k)=>items.push({w:W(a.e,k+1<A.length?A[k+1].s:T.length),amt:a.v}));
  else{let p=0;A.forEach(a=>{items.push({w:W(p,a.s),amt:a.v});p=a.e})}
  items.off=off0;return items}
function vCat(words){

function walk(root){

/* ---------- Tema ---------- */
var mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;

  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',isDark()?'#07100D':'#0F172A');

  var o=document.getElementById('thv');

  dlg.querySelector('#setSecL').textContent=s.sec;
  dlg.querySelector('#setSecH').textContent=s.sech;

  put2(dlg.querySelector('#setSecB'),i.pin?bt('pin-change',s.chg)+bt('pin-off',s.rmp)+(i.bioOK?(i.bio?bt('pin-bio-off',s.bioOff):bt('pin-bio-on',s.bioOn)):''):bt('pin-set',s.setp,1));
  dlg.querySelector('#setBkL').textContent=s.bk;
  dlg.querySelector('#setBkH').textContent=s.bkh;
  put2(dlg.querySelector('#setBkB'),bt('backup',s.save)+(i.local?'<label class="btn ghost" style="text-align:center;display:block;line-height:20px">'+s.rest+'<input id="imp" type="file" accept=".json,application/json" hidden></label>':''));

function setLang(l){

  walk(document.body);paint();
}
function openD(){paint();dlg.hidden=false;void dlg.offsetWidth;dlg.classList.add('open');btn.classList.add('on');btn.setAttribute('aria-expanded','true')}

  document.body.insertAdjacentHTML('beforeend','<div id="thv" data-notr></div>');document.body.insertAdjacentHTML('beforeend',"<div id=\"set\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"setT\" data-notr><div class=\"shc setsheet\"><div class=\"grab\"></div><h2 id=\"setT\"><span class=\"tile\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg></span><span id=\"setTt\"></span></h2><div class=\"setg\" style=\"--d:0\"><b id=\"setThL\"></b><div class=\"mmseg\" id=\"setTh\" style=\"--n:3;--i:0\"><i class=\"thumb\"></i><button type=\"button\" data-th=\"light\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"--rot:90deg\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><g class=\"ry\"><path d=\"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41\"/></g></svg><span></span></button><button type=\"button\" data-th=\"dark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"--rot:-24deg\" aria-hidden=\"true\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z\"/></svg><span></span></button   dlg=document.getElementById('set');btn=document.getElementById('setBtn');

    if(l&&l.dataset.lg!==lang){var nl=l.dataset.lg;paint();l.parentNode.style.setProperty('--i',LG.indexOf(nl));setLang(nl)}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!dlg.hidden)closeD()});

})();
