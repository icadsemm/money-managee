                  Object.keys(o).forEach(function(n){if(o[n]&&typeof o[n]==='object')b.set(fs.doc(base+p+'/'+n),o[n])});
                  b.commit().catch(function(){});}
              }catch(e){}}
            }
          },eb)}}}
      });
    });
  });
}};
})();

<script>
(function(){
'use strict';
const MS=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const ML=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const QUOTES=["Sikit-sikit lama-lama jadi bukit.","Disiplin hari ni, senang hari esok.","Setiap ringgit yang kau simpan, satu langkah ke bebas kewangan.","Penat hari ni, lega bila tengok angka naik.","Bukan berapa banyak, tapi berapa konsisten.","Rider pun boleh bina simpanan, yang penting tak putus.","Duit tidur pun kerja untuk kau.","Jangan banding dengan orang. Banding dengan kau bulan lepas.","Satu delivery lagi, satu langkah lagi.","Target RM100k bukan mimpi, cuma belum sampai lagi."];
const TABS=['ringkasan','simpanan','komitmen','bil','delivery'];
const DOCS=['saving','delivery','komitmen','spaylater','advance'];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const rm=(n,d=2)=>{n=Number(n)||0;return (n<0?'-':'')+'RM'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const pc=(x,d=0)=>(x*100).toFixed(d)+'%';
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowYm=()=>todayISO().slice(0,7);
const addYm=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const ymLab=ym=>MS[+ym.slice(5,7)-1]+' '+ym.slice(2,4);
const fmtDate=d=>d.getDate()+' '+MS[d.getMonth()]+' '+d.getFullYear();
const addMonths=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth()+n,d.getDate());return x};
const fmtISO=s=>{if(!s)return '-';const [y,m,d]=s.split('-').map(Number);return d+' '+MS[m-1]+' '+y};
const num=v=>{v=String(v).replace(/[^\d.\-]/g,'');if(v===''||v==='-'||v==='.')return null;const n=parseFloat(v);return isNaN(n)?null:n};
const uidx=()=>Math.random().toString(36).slice(2,8);

const DEF={
  saving:()=>({accounts:[],target:100000,goal:1000,
    levels:[{icon:'🌱',name:'Benih',pct:0},{icon:'🥉',name:'Perunggu',pct:.1},{icon:'🥈',name:'Perak',pct:.25},{icon:'🥇',name:'Emas',pct:.5},{icon:'💎',name:'Platinum',pct:.75},{icon:'👑',name:'Berlian',pct:1}],
    monthly:[],history:[],updated:todayISO()}),
  delivery:()=>({rows:[]}),
  komitmen:()=>({label:ML[new Date().getMonth()]+' '+new Date().getFullYear(),income:[],items:[],notes:[]}),
  spaylater:()=>({target:0,entries:[],ryt:'',spay:'',notes:[]}),
  advance:()=>({month:nowYm(),amount:0,items:[],notes:[]})
};
const state={};DOCS.forEach(n=>state[n]=DEF[n]());
const last={},dirty=new Set(),writing={},again={},timers={};
let db=null,loaded=false,dbErr='',bilTab='spay',localMode=false,nwRange='all';
const KEY='duit-icad-v1';
const SEED=null;
try{bilTab=localStorage.getItem('bilTab')||'spay'}catch(e){}
try{nwRange=localStorage.getItem('nwRange')||'all'}catch(e){}

/* ---------- calculations ---------- */
function calc(){
  const s=state.saving,k=state.komitmen,p=state.spaylater,a=state.advance,d=state.delivery,now=new Date(),cur=nowYm();
  const C={};
  C.modal=sum(s.accounts,x=>x.modal);C.nilai=sum(s.accounts,x=>x.nilai);C.profit=C.nilai-C.modal;C.roi=C.modal>0?C.profit/C.modal:0;
  const filled=s.monthly.filter(m=>m.amt>0);
  C.mTotal=sum(s.monthly,m=>m.amt);C.mAvg=filled.length?C.mTotal/filled.length:0;
  C.remain=Math.max(s.target-C.nilai,0);C.prog=s.target>0?clamp(C.nilai/s.target):0;
  C.months=C.mAvg>0?Math.ceil(C.remain/C.mAvg):null;
  C.eta=C.months!=null?addMonths(now,C.months):null;
  C.lv=s.levels.map(l=>({...l,amt:l.pct*s.target}));
  C.li=0;C.lv.forEach((l,i)=>{if(C.nilai>=l.amt)C.li=i});
  C.cur=C.lv[C.li];C.next=C.lv[C.li+1]||null;
  C.lProg=C.next?clamp((C.nilai-C.cur.amt)/((C.next.amt-C.cur.amt)||1)):1;
  C.toNext=C.next?Math.max(C.next.amt-C.nilai,0):0;
  C.nextMonths=C.next&&C.mAvg>0?Math.ceil(C.toNext/C.mAvg):null;
  C.nextDate=C.nextMonths!=null?addMonths(now,C.nextMonths):null;
  const upto=s.monthly.filter(m=>m.ym<=cur).sort((x,y)=>x.ym<y.ym?-1:1);
  let st=0;upto.forEach(m=>{if(s.goal>0&&m.amt>=s.goal)st++;else if(m.ym!==cur)st=0});
  C.streak=st;C.hits=upto.filter(m=>s.goal>0&&m.amt>=s.goal).length;C.counted=upto.filter(m=>m.amt>0).length;
  let best=null;s.monthly.forEach(m=>{if(m.amt>0&&(!best||m.amt>best.amt))best=m});C.best=best;
  const tm=s.monthly.find(m=>m.ym===cur);C.thisMonth=tm&&tm.amt?tm.amt:0;C.thisGap=Math.max(s.goal-C.thisMonth,0);
  // delivery
  const dr=d.rows;C.dInc=sum(dr,r=>r.inc);C.dTip=sum(dr,r=>r.tip);C.dSav=sum(dr,r=>r.sav);C.dNet=C.dInc+C.dTip-C.dSav;
  C.dDays=dr.filter(r=>r.inc>0).length;C.dAvg=C.dDays?C.dInc/C.dDays:0;C.dMax=dr.reduce((m,r)=>Math.max(m,Number(r.inc)||0),0);
  C.workDays=C.dAvg>0?Math.floor(C.nilai/C.dAvg):null;
  const g={};dr.forEach(r=>{if(!r.d)return;const ym=r.d.slice(0,7);const o=g[ym]||(g[ym]={ym,days:0,inc:0,tip:0,sav:0});if(r.inc>0)o.days++;o.inc+=+r.inc||0;o.tip+=+r.tip||0;o.sav+=+r.sav||0});
  C.dMonths=Object.values(g).sort((x,y)=>x.ym<y.ym?-1:1);
  // komitmen
  C.k={};C.k.income=sum(k.income,x=>x.amt);C.k.commit=sum(k.items,x=>x.amt);C.k.baki=C.k.income-C.k.commit;
  C.k.paid=sum(k.items.filter(x=>x.paid),x=>x.amt);C.k.unpaid=C.k.commit-C.k.paid;
  C.k.n=k.items.filter(x=>x.amt>0).length;C.k.unpaidN=k.items.filter(x=>x.amt>0&&!x.paid).length;
  C.k.ratio=C.k.income>0?C.k.commit/C.k.income:0;C.k.payProg=C.k.commit>0?C.k.paid/C.k.commit:0;
  C.k.big=k.items.reduce((m,x)=>(x.amt>0&&(!m||x.amt>m.amt))?x:m,null);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();C.k.daysLeft=dim-now.getDate()+1;
  C.k.perDay=C.k.baki>0?C.k.baki/C.k.daysLeft:0;
  // spaylater / advance
  C.p={got:sum(p.entries,x=>x.amt)};C.p.baki=Math.max(p.target-C.p.got,0);C.p.prog=p.target>0?clamp(C.p.got/p.target):0;
  C.a={used:sum(a.items,x=>x.amt)};C.a.baki=a.amount-C.a.used;C.a.prog=a.amount>0?clamp(C.a.used/a.amount):0;
  return C;
}

/* ---------- builders ---------- */
const inN=(k,v,label,ph='0.00')=>`<input class="in n" inputmode="decimal" autocomplete="off" data-k="${k}" data-t="n" value="${v==null?'':esc(v)}" placeholder="${ph}" aria-label="${esc(label)}">`;
const inT=(k,v,label,ph='')=>`<input class="in t" autocomplete="off" data-k="${k}" data-t="t" value="${esc(v)}" placeholder="${esc(ph)}" aria-label="${esc(label)}">`;
const inA=(k,v,label,ph='')=>`<textarea class="in t" rows="2" data-k="${k}" data-t="t" placeholder="${esc(ph)}" aria-label="${esc(label)}">${esc(v)}</textarea>`;
const del=(arr,i,label)=>`<button class="btn x" data-act="del" data-k="${arr}" data-i="${i}" aria-label="Padam ${esc(label)}">&times;</button>`;
const add=(k,label)=>`<button class="btn ghost" data-act="add" data-k="${k}">+ ${label}</button>`;
const bar=(p,cls='')=>`<div class="bar ${cls}" role="img" aria-label="${pc(p)}"><i style="width:${(clamp(p)*100).toFixed(1)}%"></i></div>`;
const kv=(l,v,cls='')=>`<div class="kv ${cls}"><span>${l}</span><b>${v}</b></div>`;
const head=(t,hint='')=>`<div><h2>${t}</h2>${hint?`<p class="hint">${hint}</p>`:''}</div>`;
const chev='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- views ---------- */
function nwFmt(n){const a=Math.abs(n);return 'RM'+(a>=1e6?(n/1e6).toFixed(2)+'J':a>=1e3?(n/1e3).toFixed(a>=1e5?0:1)+'K':Math.round(n))}
function nwChange(cur,prev){if(prev==null)return null;const d=cur-prev;return {d,p:prev>0?d/prev:null}}
function nwView(C){
  const cur=nowYm(),h=state.saving.history;
  const map={};h.forEach(x=>{if(x&&x.ym&&(+x.nilai>0||+x.modal>0))map[x.ym]={ym:x.ym,n:+x.nilai||0,m:+x.modal||0}});
  if(C.nilai>0||C.modal>0)map[cur]={ym:cur,n:C.nilai,m:C.modal};
  let all=Object.values(map).sort((a,b)=>a.ym<b.ym?-1:1);
  const near=ym=>{let b=null,bd=9;all.forEach(x=>{if(x.ym===cur)return;const d=Math.abs((+x.ym.slice(0,4)*12+ +x.ym.slice(5,7))-(+ym.slice(0,4)*12+ +ym.slice(5,7)));if(d<bd){bd=d;b=x}});return bd<=1?b:null};
  const mm=map[addYm(cur,-1)]||null,yy=near(addYm(cur,-12));
  const lastNow=map[cur]?map[cur].n:null;
  const cmp=(prev,lab)=>{if(!prev||lastNow==null)return `<div class="kv"><span>${lab}</span><b>-</b><small style="color:var(--mute)">Belum cukup data</small></div>`;
    const c=nwChange(lastNow,prev.n);const cl=c.d>0?'good':c.d<0?'bad':'';
    return `<div class="kv ${cl}"><span>${lab}</span><b class="num">${c.d>0?'+':''}${rm(c.d,0)}</b><small style="color:var(--mute)">${c.p==null?'':(c.d>0?'+':'')+pc(c.p,2)+' dari '}${ymLab(prev.ym)}</small></div>`};
  const N={'3':3,'6':6,'12':12};
  let pts=all;if(N[nwRange])pts=all.filter(x=>x.ym>=addYm(cur,-N[nwRange]));
  const seg=`<div class="seg s4" role="group" aria-label="Julat masa">${[['3','3 Bulan'],['6','6 Bulan'],['12','1 Tahun'],['all','Semua']].map(([v,t])=>`<button data-act="nwr" data-v="${v}" aria-pressed="${nwRange===v}">${t}</button>`).join('')}</div>`;
  let body;
  if(pts.length<2){
    body=`<p class="empty">${all.length<2?'Graf akan keluar bila ada sekurang-kurangnya 2 bulan snapshot. Tekan <b>Simpan snapshot</b> kat tab Simpanan hujung setiap bulan.':'Tak cukup data dalam julat ni. Cuba pilih Semua.'}</p>`;
  }else{
    const W=320,H=170,L=42,R=8,T=8,B=20,iw=W-L-R,ih=H-T-B;
    const vals=[];pts.forEach(x=>{vals.push(x.n);if(x.m>0)vals.push(x.m)});
    let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.12||Math.abs(hi)*0.1||1;
    lo-=pad;hi+=pad;if(Math.min(...vals)>=0)lo=Math.max(lo,0);
    const X=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
    const grid=[0,1,2,3].map(g=>{const v=lo+(hi-lo)*g/3,y=Y(v);return `<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:1"/><text x="${L-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${nwFmt(v)}</text>`}).join('');
    const line=pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.n).toFixed(1)}`).join(' ');
    const area=`M${X(0).toFixed(1)},${(T+ih)} L${pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.n).toFixed(1)}`).join(' L')} L${X(pts.length-1).toFixed(1)},${(T+ih)} Z`;
    const mpts=pts.map((x,i)=>x.m>0?`${X(i).toFixed(1)},${Y(x.m).toFixed(1)}`:null).filter(Boolean).join(' ');
    const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    const xl=idx.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${ymLab(pts[i].ym)}</text>`).join('');
    const data=pts.map((x,i)=>({x:+X(i).toFixed(1),y:+Y(x.n).toFixed(1),l:ymLab(x.ym),n:x.n,m:x.m}));
    const lp=data[data.length-1];
    body=`<div class="nwc" data-pts="${esc(JSON.stringify(data))}">
      <div class="nwr">${nwRead(lp)}</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf nilai aset mengikut bulan">${grid}
        <path d="${area}" style="fill:var(--accent);fill-opacity:.12"/>
        ${mpts?`<polyline points="${mpts}" style="fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:4 3"/>`:''}
        <polyline points="${line}" style="fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>
        <line class="nwl" x1="${lp.x}" x2="${lp.x}" y1="${T}" y2="${T+ih}" style="stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3"/>
        <circle class="nwd" cx="${lp.x}" cy="${lp.y}" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>
        ${xl}</svg></div>
      <div class="nwleg"><span><i></i>Nilai</span><span><i class="m"></i>Modal</span></div>`;
  }
  return `<section class="panel">${head('Trend aset','Sentuh atau seret graf untuk lihat nilai tiap bulan.')}${seg}${body}
    <div class="kvs">${cmp(mm,'Bulan ke bulan')}${cmp(yy,'Tahun ke tahun')}</div></section>`;
}
function nwRead(p){const pr=p.n-p.m;return `<b>${p.l}</b> · Nilai <b>${rm(p.n)}</b>${p.m>0?`<br>Modal ${rm(p.m)} · Profit <span style="color:var(${pr<0?'--bad':'--good'})">${pr>0?'+':''}${rm(pr)}</span>`:''}`}
function vRingkasan(C){
  const s=state.saving,k=state.komitmen,p=state.spaylater,a=state.advance;
  const serial=Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/86400000)+25569;
  const att=[];
  if(C.k.n>0){
    if(C.k.unpaidN>0)att.push({s:'warn',t:`${C.k.unpaidN} komitmen belum dibayar`,d:`${rm(C.k.unpaid)} · ${esc(k.label)}`,to:'komitmen'});
    else att.push({s:'good',t:'Semua komitmen dah dibayar',d:esc(k.label),to:'komitmen'});
  }
  if(C.k.income>0&&C.k.ratio>.9)att.push({s:'bad',t:`Komitmen ${pc(C.k.ratio,1)} daripada pendapatan`,d:'Tahap bahaya',to:'komitmen'});
  else if(C.k.income>0&&C.k.ratio>.7)att.push({s:'warn',t:`Komitmen ${pc(C.k.ratio,1)} daripada pendapatan`,d:'Berhati-hati',to:'komitmen'});
  if(p.target>0){
    if(C.p.baki>0)att.push({s:'warn',t:`SPayLater kurang ${rm(C.p.baki)}`,d:p.spay?`Ansuran ${esc(p.spay)}`:'Masih kumpul duit',to:'bil'});
    else att.push({s:'good',t:'SPayLater dah cukup, boleh bayar bil',d:p.spay?`Ansuran ${esc(p.spay)}`:'',to:'bil'});
  }
  if(a.amount>0){
    if(C.a.baki<0)att.push({s:'bad',t:`Advance melebihi ${rm(-C.a.baki)}`,d:'Semak balik kotak belanja',to:'bil'});
    else att.push({s:'good',t:`Advance berbaki ${rm(C.a.baki)}`,d:`${pc(C.a.prog)} dah diguna`,to:'bil'});
  }
  if(s.goal>0&&s.monthly.length){
    if(C.thisGap>0)att.push({s:'warn',t:`Simpanan ${MS[new Date().getMonth()]}: lagi ${rm(C.thisGap,0)} nak cecah sasaran`,d:`${rm(C.thisMonth,0)} daripada ${rm(s.goal,0)}`,to:'simpanan'});
    else att.push({s:'good',t:`Sasaran simpanan ${MS[new Date().getMonth()]} dah tercapai`,d:rm(C.thisMonth,0),to:'simpanan'});
  }
  if(k.notes.filter(Boolean).length)att.push({s:'info',t:`${k.notes.filter(Boolean).length} peringatan`,d:'Dalam tab Komitmen',to:'komitmen'});
  const empty=!s.accounts.length&&!k.items.length&&!state.delivery.rows.length&&!p.target&&!a.amount;
  return `
  <section class="hero" aria-label="Total aset">
    <p class="eyebrow">Total aset</p>

    ${bar(C.lProg)}
    <p>${C.next?`Seterusnya: ${esc(C.next.icon)} ${esc(C.next.name)} (${rm(C.next.amt,0)}) · lagi ${rm(C.toNext,0)}${C.nextMonths!=null?` · anggaran ${C.nextMonths} bulan`:''}`:'Level tertinggi, target dah tercapai!'}</p>

  <section class="panel"><div class="sec-h">${head('Perlu perhatian')}</div>
    ${att.length?`<ul class="att">${att.map(x=>`<li><a href="#${x.to}" data-s="${x.s}"><span class="dot"></span><span><b>${x.t}</b><small>${x.d||''}</small></span>${chev}</a></li>`).join('')}</ul>`:'<p class="empty">Tiada apa-apa lagi.</p>'}
  </section>
  <section class="mods" aria-label="Ringkasan modul">
    <a class="mod hi" href="#simpanan"><span class="eyebrow">Simpanan bulan ni</span><span class="v num">${rm(C.thisMonth,0)}</span><small>Sasaran ${rm(s.goal,0)} · streak ${C.streak} bulan</small>${bar(s.goal>0?C.thisMonth/s.goal:0)}</a>

    <a class="mod" href="#bil"><span class="eyebrow">SPayLater kurang</span><span class="v num">${rm(C.p.baki)}</span><small>${pc(C.p.prog)} terkumpul</small>${bar(C.p.prog)}</a>
    <a class="mod ${C.a.baki<0?'neg':''}" href="#bil"><span class="eyebrow">Baki advance</span><span class="v num">${rm(C.a.baki)}</span><small>${pc(C.a.prog)} diguna</small>${bar(C.a.prog,C.a.baki<0?'bad':'')}</a>
    <a class="mod" href="#delivery"><span class="eyebrow">Bersih delivery</span><span class="v num">${rm(C.dNet)}</span><small>${C.dDays} hari kerja</small></a>
    <a class="mod" href="#simpanan"><span class="eyebrow">Profit pelaburan</span><span class="v num ${C.profit<0?'neg':''}" style="${C.profit<0?'color:var(--bad)':''}">${rm(C.profit)}</span><small>ROI ${pc(C.roi,2)}</small></a>
  </section>`;
}

const okLogo=v=>typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(v);
async function toLogo(file){
  let src,w,h,rev=()=>{};
  try{src=await createImageBitmap(file);w=src.width;h=src.height}
  catch(e){const u=URL.createObjectURL(file);src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u});w=src.naturalWidth;h=src.naturalHeight;rev=()=>URL.revokeObjectURL(u)}
  const m=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=96;
  const g=c.getContext('2d');g.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,96,96);rev();
  const out=c.toDataURL('image/png');return out.length>60000?c.toDataURL('image/jpeg',.8):out;
}
function vSimpanan(C){
  const s=state.saving;

/* ---------- render ---------- */
const main=document.getElementById('main');
const curTab=()=>{const h=location.hash.slice(1);return TABS.includes(h)?h:'ringkasan'};
let pendingFocus=null;
function render(){
  const tab=curTab();
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.getElementById('sub').textContent=ML[new Date().getMonth()]+' '+new Date().getFullYear();
  let html='';
  if(!loaded&&db!==false){html='<p class="empty">Memuat data…</p>'}
  else{
    const C=calc();
    if(dbErr)html+=`<div class="banner">${esc(dbErr)}</div>`;
    html+=({ringkasan:vRingkasan,simpanan:vSimpanan,komitmen:vKomitmen,bil:vBil,delivery:vDelivery})[tab](C);
  }
  const ae=document.activeElement,key=ae&&ae.dataset?ae.dataset.k:null;let ss=null;try{ss=ae.selectionStart}catch(e){}
  main.innerHTML=html;
  if(pendingFocus){const el=[...main.querySelectorAll('[data-k]')].find(e=>e.dataset.k.startsWith(pendingFocus));pendingFocus=null;if(el)el.focus();}
  else if(key){const el=[...main.querySelectorAll('[data-k]')].find(e=>e.dataset.k===key);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
}
let rq=0;const later=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>setTimeout(render,0))};
window.addEventListener('hashchange',()=>{later();window.scrollTo(0,0)});

/* ---------- state mutation + saving ---------- */
function setSync(s,t){const e=document.getElementById('sync');e.dataset.s=s;document.getElementById('syncT').textContent=t}
function touch(name){dirty.add(name);clearTimeout(timers[name]);setSync('saving','Menyimpan');timers[name]=setTimeout(()=>flush(name),600)}
async function flush(name){
  if(!db){
    if(localMode){try{localStorage.setItem(KEY,JSON.stringify(state));dirty.delete(name);if(!dirty.size)setSync('ok','Tersimpan di peranti')}catch(e){setSync('err','Tak boleh simpan');dbErr='Browser ni tak benarkan simpan data. Guna Simpan fail untuk sandaran.';later()}return}
    setSync('err','Tak disimpan');return}
  if(writing[name]){again[name]=true;return}
  writing[name]=true;dirty.delete(name);
  const body=JSON.parse(JSON.stringify(state[name]));
  try{await db.doc('m/'+name).set(body);last[name]=JSON.stringify(body);dbErr='';if(!dirty.size&&!again[name])setSync('ok','Tersimpan')}
  catch(e){setSync('err','Gagal simpan');dbErr='Data gagal disimpan ('+(e&&e.code||'ralat')+'). Cuba lagi sekejap.';later()}
  writing[name]=false;
  if(again[name]||dirty.has(name)){again[name]=false;flush(name)}
}
function setK(path,val){const p=path.split('.');const doc=p.shift();let o=state[doc];for(let i=0;i<p.length-1;i++)o=o[p[i]];const lk=p[p.length-1];if(o[lk]===val)return false;o[lk]=val;touch(doc);return true}
function getArr(path){const p=path.split('.');const doc=p.shift();let o=state[doc];p.forEach(x=>o=o[x]);return [doc,o]}
const NEW={
  'saving.accounts':()=>({name:'',modal:null,nilai:null}),
  'saving.monthly':()=>{const a=state.saving.monthly;const l=a.reduce((m,x)=>x.ym>m?x.ym:m,'');return {ym:l?addYm(l,1):nowYm(),amt:null}},
  'saving.history':()=>{const a=state.saving.history;const l=a.reduce((m,x)=>x.ym>m?x.ym:m,'');return {ym:l?addYm(l,1):nowYm(),modal:null,nilai:null}},
  'komitmen.income':()=>({name:'',amt:null}),
  'komitmen.items':()=>({name:'',amt:null,paid:false}),
  'komitmen.notes':()=>'',
  'spaylater.entries':()=>({name:'',amt:null}),
  'spaylater.notes':()=>'',
  'advance.items':()=>({name:'',amt:null}),
  'advance.notes':()=>'',
  'delivery.rows':()=>({d:todayISO(),inc:null,tip:null,sav:null})
};

document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.k)return;
  const ty=t.dataset.t;let v;
  if(ty==='n')v=num(t.value);else if(ty==='b')v=t.checked;else v=t.value.trim();
  if(setK(t.dataset.k,v))later();
});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='imp'||!t.files||!t.files[0])return;
  t.files[0].text().then(tx=>{try{const o=JSON.parse(tx);DOCS.forEach(n=>{if(o[n]){state[n]=Object.assign(DEF[n](),o[n]);touch(n)}});dbErr=localMode?dbErr:'';later()}catch(x){dbErr='Fail sandaran tak sah.';later()}})});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||t.dataset.logo==null||!t.files||!t.files[0])return;
  const i=+t.dataset.logo,f=t.files[0];
  toLogo(f).then(d=>{const a=state.saving.accounts[i];if(!a)return;a.logo=d;touch('saving');later()})
   .catch(()=>{dbErr='Logo tak dapat dimuat. Cuba gambar lain.';later()});
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='logo-clear'){const a=state.saving.accounts[+b.dataset.i];if(a){delete a.logo;touch('saving');later()}return}
  if(act==='nwr'){nwRange=b.dataset.v;try{localStorage.setItem('nwRange',nwRange)}catch(x){}later();return}
  if(act==='seg'){bilTab=b.dataset.v;try{localStorage.setItem('bilTab',bilTab)}catch(x){}later();return}
  if(act==='add'){const k=b.dataset.k;const [doc,arr]=getArr(k);arr.push(NEW[k]());touch(doc);pendingFocus=k+'.'+(arr.length-1);later();return}
  if(act==='del'){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Pasti?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML='&times;'}},3000);return}
    const [doc,arr]=getArr(b.dataset.k);arr.splice(+b.dataset.i,1);touch(doc);later();return}
  if(act==='reset-paid'){state.komitmen.items.forEach(x=>x.paid=false);touch('komitmen');later();return}
  if(act==='snap'){const C=calc(),ym=nowYm();let h=state.saving.history.find(x=>x.ym===ym);if(!h){h={ym};state.saving.history.push(h)}h.modal=+C.modal.toFixed(2);h.nilai=+C.nilai.toFixed(2);touch('saving');later();return}
  if(act==='backup'){const fn='duit-icad-sandaran-'+todayISO()+'.json',txt=JSON.stringify(state,null,2);
    const local=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
    Promise.resolve().then(()=>typeof claude!=='undefined'?claude.use('downloads'):null).then(dl=>dl?dl.save({filename:fn,data:txt}).catch(()=>{}):local()).catch(local);return}
});

/* net worth chart scrub */
function nwScrub(e){
  const w=e.target.closest&&e.target.closest('.nwc');if(!w)return;
  if(e.type==='pointermove'&&e.pointerType==='mouse'&&!e.buttons&&false)return;
  let pts;try{pts=JSON.parse(w.dataset.pts)}catch(x){return}
  const sv=w.querySelector('svg'),r=sv.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*320;
  let b=pts[0];pts.forEach(p=>{if(Math.abs(p.x-vx)<Math.abs(b.x-vx))b=p});
  const l=w.querySelector('.nwl'),d=w.querySelector('.nwd');
  l.setAttribute('x1',b.x);l.setAttribute('x2',b.x);d.setAttribute('cx',b.x);d.setAttribute('cy',b.y);
  w.querySelector('.nwr').innerHTML=nwRead(b);
}
document.addEventListener('pointerdown',nwScrub);
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons&&!(e.target.closest&&e.target.closest('.nwc')))return;nwScrub(e)});

/* ---------- boot ---------- */
render();
(async()=>{
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){db=false;localMode=true;loaded=true;
    try{const raw=localStorage.getItem(KEY);const src=raw?JSON.parse(raw):SEED;if(src)DOCS.forEach(n=>{if(src[n])state[n]=Object.assign(DEF[n](),src[n])});dbErr='Mod peranti: data disimpan dalam browser ni sahaja dan tak sync dengan peranti lain. Guna Simpan fail untuk sandaran.'}
    catch(e){if(SEED)DOCS.forEach(n=>{if(SEED[n])state[n]=Object.assign(DEF[n](),SEED[n])});dbErr='Browser ni tak benarkan simpan data, jadi ubahan hilang bila ditutup. Guna Simpan fail untuk sandaran.'}
    setSync('ok','Mod peranti');later();return}
  db.collection('m').onSnapshot(snap=>{
    snap.docs.forEach(doc=>{
      const n=doc.id;if(!DOCS.includes(n))return;
      if(dirty.has(n)||writing[n])return;
      const raw=JSON.stringify(doc.data());if(raw===last[n])return;
      last[n]=raw;state[n]=Object.assign(DEF[n](),JSON.parse(raw));
    });
    loaded=true;if(!dirty.size)setSync('ok','Tersimpan');
    const ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.dataset.k){ae.addEventListener('blur',()=>later(),{once:true})}else later();
  },err=>{loaded=true;dbErr='Data tak dapat dimuat ('+(err&&err.code||'ralat')+').';setSync('err','Ralat');later()});
})();
})();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
