name: Hantar peringatan

# Jalan setiap jam. Skrip hanya hantar notifikasi pada waktu yang betul untuk tiap pengguna.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Hantar notifikasi tes ke semua fon yang berdaftar (1 = ya)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  hantar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pasang firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Tulis skrip
        run: |
          cat > notify.mjs <<'JS'
          const MS=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
          const DAY=864e5;

          /* waktu setempat pengguna */
          export function localNow(tz,now=new Date()){
            let f;try{f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}
            catch{f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}
            const p=Object.fromEntries(f.formatToParts(now).map(x=>[x.type,x.value]));
            return {today:Date.UTC(+p.year,+p.month-1,+p.day),hour:+p.hour,ymd:`${p.year}-${p.month}-${p.day}`};
          }
          const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null};

          /* tarikh peringatan seterusnya (sama logik dengan app) */
          export function occ(r){
            const b=parse(r.d);if(b==null)return null;
            if(!r.rep)return r.done?null:b;
            const after=parse(r.doneOn),st=r.rep==='y'?12:r.rep==='m6'?6:r.rep==='m3'?3:1;
            const bd=new Date(b);
            for(let i=0;i<2400;i++){
              const y=bd.getUTCFullYear(),m=bd.getUTCMonth()+i*st,dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
              const d=Date.UTC(y,m,Math.min(bd.getUTCDate(),dim));
              if(after==null||d>after)return d;
            }
            return null;
          }
          const fmt=t=>{const d=new Date(t);return d.getUTCDate()+' '+MS[d.getUTCMonth()]+' '+d.getUTCFullYear()};

          /* senarai notifikasi yang patut dihantar sekarang */
          export function dueNow(reminders,tz,now=new Date(),sent={}){
            const {today,hour,ymd}=localNow(tz,now),out=[];
            const add=(m)=>{if(sent&&sent[m.tag]===ymd)return;out.push(m)};
            for(const r of reminders||[]){
              if(!r||!r.t)continue;
              const o=occ(r);if(o==null)continue;
              const days=Math.round((o-today)/DAY),tmH=/^(\d{1,2}):\d{2}$/.test(r.tm||'')?+r.tm.split(':')[0]:null;
              const title=`${r.e||'🔔'} ${r.t}`,when=r.tm?` · ${r.tm}`:'',id=r.id||r.t;
              /* ada masa: hantar pada jam itu (atau jam selepasnya kalau jadual lewat) */
              if(tmH!=null&&days===0&&(hour===tmH||hour===tmH+1)){add({title,body:'Hari ni'+when,tag:`${id}-0`});continue}
              /* ringkasan pagi: jam 8 hingga 10 setempat */
              if(hour<8||hour>10)continue;
              if(days===3)add({title,body:`3 hari lagi (${fmt(o)})${when}`,tag:`${id}-3`});
              else if(days===1)add({title,body:`Esok${when}`,tag:`${id}-1`});
              else if(days===0&&tmH==null)add({title,body:'Hari ni',tag:`${id}-0`});
              else if(days===0&&tmH!=null&&tmH<8)add({title,body:'Hari ni'+when,tag:`${id}-0`});
              else if(days<0&&days>=-2)add({title,body:`Lewat ${-days} hari (${fmt(o)})`,tag:`${id}-late${-days}`});
            }
            return out;
          }

          async function main(){
            const admin=(await import('firebase-admin')).default;
            const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'');
            admin.initializeApp({credential:admin.credential.cert(sa)});
            const db=admin.firestore(),fcm=admin.messaging(),test=process.env.TEST==='1';
            const snap=await db.collectionGroup('m').get(),users={};
            snap.forEach(d=>{if(d.id!=='custom'&&d.id!=='push')return;const u=d.ref.parent.parent;if(!u)return;(users[u.path]??={})[d.id]={data:d.data(),ref:d.ref}});
            let sent=0,dead=0,n=0;
            for(const [path,u] of Object.entries(users)){
              const tokens=(u.push&&u.push.data.tokens)||[];if(!tokens.length)continue;
              const tz=(u.push.data.tz)||'Asia/Kuala_Lumpur';n++;
              const list=test?[{title:'Tes notifikasi ✅',body:'Penghantar berjadual berfungsi.',tag:'mm-test'}]:dueNow(u.custom&&u.custom.data.reminders,tz,new Date(),u.push.data.sent||{});
              const ymd=localNow(tz).ymd,mark={};
              for(const m of list){mark[m.tag]=ymd;for(const token of tokens){
                try{await fcm.send({token,data:{title:m.title,body:m.body,tag:m.tag,url:'./'},android:{priority:'high'},webpush:{headers:{Urgency:'high',TTL:'7200'}}});sent++}
                catch(e){const c=e&&e.code||'';
                  if(/registration-token-not-registered|invalid-registration-token|invalid-argument/.test(c)){dead++;await u.push.ref.update({tokens:admin.firestore.FieldValue.arrayRemove(token)}).catch(()=>{})}
                  else console.error('hantar gagal',path,c)}
              }}
              if(!test&&list.length)await u.push.ref.set({sent:mark},{merge:true}).catch(()=>{});
            }
            console.log(`Selesai: ${n} pengguna ada token, ${sent} dihantar, ${dead} token mati dibuang.`);
          }
          if(process.argv[1]&&import.meta.url===new URL('file://'+process.argv[1]).href)main().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Hantar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event.inputs.test }}
        run: node notify.mjs
